<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Stickman Arena — Vacky Games</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;background:#f2e8d7;overflow:hidden;user-select:none;
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#2b2620}
  canvas{display:block;touch-action:none}
  .overlay{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;
    justify-content:center;gap:15px;background:rgba(245,236,221,.93);text-align:center;
    padding:20px;z-index:10}
  .hidden{display:none}
  h1{font-size:28px;letter-spacing:.05em;color:#d2691e}
  h2{font-size:20px;letter-spacing:.03em}
  p{opacity:.68;font-size:13px;line-height:1.55;max-width:320px}
  .btn{background:#d2691e;color:#fff8ec;border:0;border-radius:11px;padding:13px 32px;
    font-size:16px;font-weight:700;letter-spacing:.04em;cursor:pointer}
  .cards{display:flex;flex-direction:column;gap:8px;width:min(320px,90vw);
    max-height:62vh;overflow-y:auto}
  .card{background:#fdf6e8;border:2.5px solid #2b2620;border-radius:12px;padding:10px 12px;
    cursor:pointer;display:flex;gap:11px;align-items:center;text-align:left;
    box-shadow:3px 3px 0 #2b2620}
  .card:active{transform:translate(2px,2px);box-shadow:1px 1px 0 #2b2620}
  .card.rare{border-color:#8a53c4;background:#f7eefc;
    box-shadow:3px 3px 0 #8a53c4, 0 0 16px rgba(138,83,196,.35)}
  .card.rare:active{box-shadow:1px 1px 0 #8a53c4}
  .card.rare b{color:#7b3fb5}
  .card.rare .rr{font-size:10px;letter-spacing:.14em;color:#8a53c4;font-weight:800}
  .card canvas{background:transparent;flex:0 0 40px}
  .card b{display:block;font-size:14px}
  .card span{font-size:11.5px;opacity:.65}
  .tag{font-size:11px;letter-spacing:.12em;opacity:.5}
  .hud-btn{position:fixed;right:14px;bottom:20px;width:86px;height:86px;border-radius:50%;
    border:3px solid #2b2620;background:#fdf6e8;box-shadow:3px 3px 0 #2b2620;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
    cursor:pointer;z-index:8;font-family:inherit;color:#2b2620;padding:0}
  .hud-btn:disabled{opacity:.42;box-shadow:none;cursor:default}
  .hud-btn:not(:disabled):active{transform:translate(2px,2px);box-shadow:1px 1px 0 #2b2620}
  .hud-btn canvas{width:36px;height:36px}
  .hud-btn em{font-style:normal;font-size:10.5px;font-weight:700;letter-spacing:.02em}
  .hud-pause{position:fixed;left:14px;top:56px;width:44px;height:44px;border-radius:12px;
    border:3px solid #2b2620;background:#fdf6e8;box-shadow:3px 3px 0 #2b2620;cursor:pointer;
    display:flex;align-items:center;justify-content:center;gap:5px;z-index:8;padding:0}
  .hud-pause:active{transform:translate(2px,2px);box-shadow:1px 1px 0 #2b2620}
  .hud-pause b{display:block;width:5px;height:17px;background:#2b2620;border-radius:2px}
  /* ВРЕМЕННО: тестовая кнопка, перед публикацией удалить */
  .hud-dev{position:fixed;left:14px;top:108px;height:34px;padding:0 12px;border-radius:9px;
    border:2.5px dashed #8d8178;background:rgba(253,246,232,.85);color:#6d6459;cursor:pointer;
    font-family:inherit;font-weight:800;font-size:13px;letter-spacing:.06em;z-index:8}
  .hud-dev:active{transform:translate(1px,1px)}
  .hud-badge{position:fixed;left:14px;bottom:22px;width:88px;height:88px;z-index:8;
    pointer-events:auto;cursor:pointer}
  .hud-badge:active{transform:scale(.94)}
</style>
</head>
<body>
<canvas id="c"></canvas>
<button id="pauseBtn" class="hud-pause" title="Пауза (P)"><b></b><b></b></button>
<button id="devLvl" class="hud-dev" title="Тестовая кнопка: +1 уровень">+LV</button>
<canvas id="petBadge" class="hud-badge hidden" width="176" height="176"></canvas>
<button id="useBtn" class="hud-btn" disabled>
  <canvas id="useIco" width="72" height="72"></canvas><em id="useName">пусто</em>
</button>

<div id="start" class="overlay">
  <h1>STICKMAN ARENA</h1>
  <p>Веди пальцем — человечек бежит по карте.<br>Ружьё целится само.<br>
     Ищи сундуки: мина, граната, лёд, опыт ×2.<br>За уровень может выпасть питомец.<br>Предмет — кнопка справа внизу или пробел.</p>
  <button class="btn" id="btnStart">ИГРАТЬ</button>
  <div class="tag" id="verTag"></div>
</div>
<div id="levelup" class="overlay hidden">
  <h2>НОВЫЙ УРОВЕНЬ</h2><div class="tag" id="queueTag"></div><div class="cards" id="cards"></div>
</div>
<div id="pause" class="overlay hidden">
  <h2>ПАУЗА</h2>
  <p id="pauseStats"></p>
  <button class="btn" id="btnResume">ПРОДОЛЖИТЬ</button>
  <button class="btn" id="btnRestart" style="background:#8d8178">ЗАНОВО</button>
</div>

<div id="over" class="overlay hidden">
  <h2>ЗАБЕГ ОКОНЧЕН</h2><p id="stats"></p>
  <div class="tag">ПОСТОЯННОЕ УЛУЧШЕНИЕ</div><div class="cards" id="perks"></div>
</div>

  <script src="src/core.js"></script>
  <script src="src/config.js"></script>
  <script src="src/pets.js"></script>
  <script src="src/draw-pets.js"></script>
  <script src="src/state.js"></script>
  <script src="src/world.js"></script>
  <script src="src/update.js"></script>
  <script src="src/ult.js"></script>
  <script src="src/cards.js"></script>
  <script src="src/draw-hero.js"></script>
  <script src="src/draw-foe.js"></script>
  <script src="src/render.js"></script>
  <script src="src/ui.js"></script>
</body>
</html>
