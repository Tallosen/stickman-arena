<style>

  html,body{height:100%;background:#f2e8d7;overflow:hidden;user-select:none;

</style>

<body>
<canvas id="c"></canvas>
<button id="pauseBtn" class="hud-pause" title="Пауза (P)"><b></b><b></b></button>

<div id="start" class="overlay">
  <h1>STICKMAN ARENA</h1>
  <p>Веди пальцем — человечек бежит по карте.<br>Ружьё целится само.<br>
     Ищи сундуки: мина, граната, лёд, опыт ×2.<br>За уровень может выпасть питомец.<br>Предмет — кнопка справа внизу или пробел.</p>

  <div class="tag">ПОСТОЯННОЕ УЛУЧШЕНИЕ</div><div class="cards" id="perks"></div>

<script>
"use strict";
/* ══════════════════════════════════════════════════════════════
   Stickman Arena v4 — рисованный стиль
   Всё рисуется «от руки»: линии слегка кривые, как карандашом.
   ══════════════════════════════════════════════════════════════ */

const cv = document.getElementById("c"), ctx = cv.getContext("2d");
let W, H, DPR;
function resize() {
  DPR = Math.min(devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight;
  cv.width = W * DPR; cv.height = H * DPR;
  cv.style.width = W + "px"; cv.style.height = H + "px";
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
addEventListener("resize", resize); resize();

const WORLD = 2800, cam = { x: 0, y: 0 };
const PAPER = "#f5ecdd", INK = "#2b2620", HERO = "#d2691e", FOE = "#c8402c";

/* ── карандашные примитивы ────────────────────────────────── */
function hash(a, b) { const s = Math.sin(a * 12.9898 + b * 4.1414) * 43758.5453; return s - Math.floor(s); }
function sline(g, x1, y1, x2, y2) {          // чуть кривая линия
  const dx = x2 - x1, dy = y2 - y1, L = Math.hypot(dx, dy);
  const o = (hash(x1 + x2, y1 + y2) - .5) * Math.min(4, L * .10);
  g.beginPath(); g.moveTo(x1, y1);
  g.quadraticCurveTo((x1 + x2) / 2 - dy / L * o, (y1 + y2) / 2 + dx / L * o, x2, y2);
  g.stroke();
}
function scircle(g, x, y, r, fill) {         // кружок «от руки»
  const w = 1 + (hash(x, y) - .5) * .10;
  g.beginPath(); g.ellipse(x, y, r * w, r / w, hash(y, x) * 3, 0, 6.2832);
  if (fill) { g.fillStyle = fill; g.fill(); }
  g.stroke();
}
function spoly(g, pts, fill) {
  g.beginPath(); g.moveTo(pts[0][0], pts[0][1]);
  for (let i = 1; i < pts.length; i++) g.lineTo(pts[i][0], pts[i][1]);
  g.closePath();
  if (fill) { g.fillStyle = fill; g.fill(); }
  g.stroke();
}

/* ── звук ─────────────────────────────────────────────────── */
let AC = null;
const audio = () => AC || (AC = new (window.AudioContext || webkitAudioContext)());
function beep(f, d, ty = "square", v = .05, sl = 0) {
  try {
    const a = audio(), o = a.createOscillator(), g = a.createGain();
    o.type = ty; o.frequency.setValueAtTime(f, a.currentTime);
    if (sl) o.frequency.exponentialRampToValueAtTime(Math.max(40, f + sl), a.currentTime + d);
    g.gain.setValueAtTime(v, a.currentTime);
    g.gain.exponentialRampToValueAtTime(.0001, a.currentTime + d);
    o.connect(g); g.connect(a.destination); o.start(); o.stop(a.currentTime + d);
  } catch (e) {}
}
function noise(dur, vol, cut, sweep) {
  try {
    const a = audio(), n = Math.floor(a.sampleRate * dur);
    const buf = a.createBuffer(1, n, a.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
    const src = a.createBufferSource(); src.buffer = buf;
    const f = a.createBiquadFilter(); f.type = "lowpass";
    f.frequency.setValueAtTime(cut, a.currentTime);
    if (sweep) f.frequency.exponentialRampToValueAtTime(Math.max(80, cut + sweep), a.currentTime + dur);
    const g = a.createGain(); g.gain.setValueAtTime(vol, a.currentTime);
    g.gain.exponentialRampToValueAtTime(.0001, a.currentTime + dur);
    src.connect(f); f.connect(g); g.connect(a.destination); src.start();
  } catch (e) {}
}
const vary = () => .92 + Math.random() * .16;
const chain = (notes, ty = "triangle", v = .05) =>
  notes.forEach((n, i) => setTimeout(() => beep(n, .11, ty, v), i * 75));

const SFX = {
  shot: () => { beep(700 * vary(), .045, "square", .02, -300); noise(.05, .02, 3000, -2000); },
  pop:  () => { beep(330 * vary(), .11, "triangle", .04, -190); noise(.12, .035, 1600, -1200); },
  hurt: () => { beep(150, .22, "sawtooth", .07, -80); noise(.18, .05, 900, -600); },
  level:() => chain([523, 659, 784, 1047], "square", .05),
  chest:() => chain([784, 988, 1175], "triangle", .05),
  heal: () => chain([659, 880], "sine", .06),
  boom: () => { beep(80, .4, "sawtooth", .08, -40); noise(.45, .1, 1800, -1600); },
  ice:  () => { beep(1400, .35, "sine", .045, -900); noise(.3, .03, 5000, -4000); },
  bite: () => { beep(220, .07, "square", .035, -120); noise(.09, .04, 1400, -900); },
  dead: () => chain([440, 330, 247, 165], "triangle", .06),
  revive:() => chain([392, 523, 659, 880], "sine", .06),
  build:() => { beep(500, .05, "square", .03); setTimeout(() => beep(700, .07, "square", .03), 60); },
};

/* ── одежда ───────────────────────────────────────────────── */
const GEAR = {
  gun:    { name: "Ружьё",    desc: "Урон больше",         max: 4 },
  helm:   { name: "Шапка",    desc: "+1 сердце",           max: 4 },
  jacket: { name: "Куртка",   desc: "Дольше неуязвим",     max: 3 },
  gloves: { name: "Перчатки", desc: "Стреляешь чаще",      max: 4 },
  boots:  { name: "Сапоги",   desc: "Бежишь быстрее",      max: 4 },
  scope:  { name: "Прицел",   desc: "Дальность больше",    max: 3 },
  clip:   { name: "Магазин",  desc: "Ещё одна пуля",       max: 3 },
  cape:   { name: "Плащ",     desc: "Опыт летит издалека", max: 3 },
};
const GK = Object.keys(GEAR);

/* Редкие стволы. Базовый есть всегда, редкие выпадают нечасто
   и полностью меняют способ стрельбы.                          */
const WEAPONS = {
  basic:   { name: "Ружьё",     rare: 0, desc: "Надёжный ствол" },
  shotgun: { name: "Дробовик",  rare: 1, desc: "Веер дроби, но близко" },
  sniper:  { name: "Снайперка", rare: 1, desc: "Прошивает всех насквозь" },
  minigun: { name: "Миниган",   rare: 1, desc: "Шквал огня в упор" },
};
const RARE_KEYS = Object.keys(WEAPONS).filter(k => WEAPONS[k].rare);
const RARE_CHANCE = .24;
const TIER = ["#8a8178", "#4e8f4a", "#3d78bd", "#8a53c4", "#dfa128"];

const PERKS = {
  hp:   { name: "Закалка",  desc: "+1 сердце навсегда" },
  dmg:  { name: "Сила",     desc: "+15% урона навсегда" },
  spd:  { name: "Резвость", desc: "+8% скорости навсегда" },
  luck: { name: "Удача",    desc: "Сундуки чаще" },
};
const meta = { hp: 0, dmg: 0, spd: 0, luck: 0, best: 0 };

const ITEMS = {
  mine: { name: "Мина",    col: "#c8402c" },
  nade: { name: "Граната", col: "#4e8f4a" },
  ice:  { name: "Лёд",     col: "#4aa8cf" },
  xp:   { name: "Опыт ×2", col: "#dfa128" },
};


/* ── питомцы ──────────────────────────────────────────────── */
const PETS = {
  dog:    { name: "Собака",  desc: "Кидается на врагов с пилой" },
  cat:    { name: "Кошка",   desc: "Автомат на спине, стреляет сама" },
  parrot: { name: "Попугай", desc: "Летает и роняет мини-мины" },
  mole:   { name: "Крот",    desc: "Ныряет и ставит турели" },
  boar:   { name: "Кабан",   desc: "Взрывается на крупных врагах", revive: 19000 },
  chicken:{ name: "Курица",  desc: "Несёт яйца, из них цыплята" },
};
const PET_MAX = 5;
let turrets = [], eggs = [], chicks = [], pendingPet = null, pendingRare = null, lastPetRoll = null, queuedLevels = 0;

function petStats(p) {
  const l = p.lvl;
  return {
    dogDmg:  1.6 + 1.25 * l,
    dogCd:   620 - 45 * l,
    catDmg:  .5 + .35 * l,
    catCd:   470 - 62 * l,
    mineCap: l <= 2 ? 3 : l <= 4 ? 5 : 7,
    mineDmg: 3 + 1.5 * l,
    dropCd:  2400 - 190 * l,
    turCap:  1 + Math.floor(l / 2),
    turDmg:  .8 + .4 * l,
    turCd:   760 - 70 * l,
    boarR:   96 + 24 * l,
    boarDmg: 8 + 4.5 * l,
    eggCap:  2 + l,
    eggCd:   3400 - 330 * l,
    chickDmg:.7 + .38 * l,
  };
}
function makePet(type) {
  return { type, lvl: 1, x: P.x + 40, y: P.y + 20, a: 0, face: 1, phase: 0,
           cd: 0, drop: 0, state: "up", timer: 1400, saw: 0, aim: 0, bite: 0,
           r: 11, hp: 4, hpMax: 4, hurt: 0, dead: 0,
           reviveMs: PETS[type].revive || 12000 };
}

function updatePet(dt, k) {
  const p = P.pet; if (!p) return;
  if (p.dead > 0) {                       // ждём воскрешения
    p.dead -= dt;
    if (p.dead <= 0) {
      p.hpMax = 4 + p.lvl; p.hp = p.hpMax;
      p.x = P.x + rnd(-30, 30); p.y = P.y + rnd(-30, 30);
      p.state = "up"; p.timer = 1200; SFX.revive();
      for (let i = 0; i < 12; i++) {
        const a = Math.random() * 6.28;
        puffs.push({ x: p.x, y: p.y, vx: Math.cos(a) * 2, vy: Math.sin(a) * 2, life: 1, r: rnd(2, 5) });
      }
    }
    return;
  }
  if (p.hurt > 0) p.hurt -= dt;
  const S = petStats(p);
  p.saw += .5 * k; p.phase += .3 * k;
  if (p.bite > 0) p.bite -= dt;
  if (p.cd > 0) p.cd -= dt;

  const nearest = (x, y, rng) => {
    let b = null, bd = rng;
    for (const e of enemies) { const d = Math.hypot(e.x - x, e.y - y); if (d < bd) { bd = d; b = e; } }
    return b;
  };
  const flying = p.type === "parrot";
  const goto = (tx, ty, sp) => {
    const dx = tx - p.x, dy = ty - p.y, d = Math.hypot(dx, dy);
    if (d <= 4) return d;
    let vx = dx / d, vy = dy / d;
    if (!flying) for (const o of props) {          // облетаем камень стороной
      const ox = o.x - p.x, oy = o.y - p.y, od = Math.hypot(ox, oy);
      const reach = o.r * .78 + p.r + 30;
      if (od > reach || od < .01) continue;
      if (ox / od * vx + oy / od * vy < .1) continue;
      const side = (ox * vy - oy * vx) > 0 ? -1 : 1, w = (1 - od / reach) * 2.1;
      vx += -oy / od * side * w; vy += ox / od * side * w;
    }
    const vl = Math.hypot(vx, vy) || 1;
    p.x += vx / vl * sp * k; p.y += vy / vl * sp * k;
    if (Math.abs(dx) > 1) p.face = dx > 0 ? 1 : -1;
    return d;
  };

  if (p.type === "dog") {
    // собака держится рядом с хозяином: дальше поводка не уходит
    const LEASH = 165;
    const homeX = P.x - P.face * 36, homeY = P.y + 20;
    const fromOwner = Math.hypot(p.x - P.x, p.y - P.y);

    let tg = null;
    if (fromOwner < LEASH && p.cd <= 0) {
      let bd = 130;
      for (const e of enemies) {
        if (Math.hypot(e.x - P.x, e.y - P.y) > LEASH) continue;   // цель тоже должна быть рядом
        const d = Math.hypot(e.x - p.x, e.y - p.y);
        if (d < bd) { bd = d; tg = e; }
      }
    }

    if (fromOwner > LEASH) {
      goto(P.x, P.y, 3.1);                                        // отбежала — возвращается
    } else if (tg) {
      goto(tg.x, tg.y, 2.9);
      if (Math.hypot(tg.x - p.x, tg.y - p.y) < tg.r + 16) {
        hit(tg, S.dogDmg, p.x, p.y); p.cd = S.dogCd; p.bite = 220; SFX.bite();
      }
    } else if (Math.hypot(homeX - p.x, homeY - p.y) > 28) {
      goto(homeX, homeY, 2.5);                                    // трусит у ноги
    }

  } else if (p.type === "cat") {
    const bx = P.x - P.face * 44, by = P.y + 16;
    if (Math.hypot(bx - p.x, by - p.y) > 16) goto(bx, by, 3.0);
    const tg = nearest(p.x, p.y, 250);
    if (tg) {
      p.aim = Math.atan2(tg.y - p.y - 8, tg.x - p.x);
      if (p.cd <= 0) {
        p.cd = S.catCd; beep(900, .035, "square", .015, -300);
        shots.push({ x: p.x + Math.cos(p.aim) * 16, y: p.y - 8 + Math.sin(p.aim) * 16,
                     vx: Math.cos(p.aim) * 7.6, vy: Math.sin(p.aim) * 7.6,
                     a: p.aim, life: 800, dmg: S.catDmg });
      }
    }

  } else if (p.type === "parrot") {
    p.a += .028 * k;
    goto(P.x + Math.cos(p.a) * 96, P.y - 30 + Math.sin(p.a) * 62, 4.2);
    p.drop -= dt;
    const mine = mines.filter(m => m.mini).length;
    if (p.drop <= 0 && mine < S.mineCap) {
      p.drop = S.dropCd;
      mines.push({ x: p.x, y: p.y + 26, arm: 500, mini: true, dmg: S.mineDmg });
    }

  } else if (p.type === "boar") {
    // ищем крупную цель, ради неё и живёт
    let tg = null, bd = 1e9;
    for (const e of enemies) {
      if (e.kind !== "tank" && e.kind !== "elite") continue;
      const d = Math.hypot(e.x - p.x, e.y - p.y);
      if (d < bd) { bd = d; tg = e; }
    }
    if (!tg) {                                   // крупных нет — берём любого рядом
      for (const e of enemies) {
        const d = Math.hypot(e.x - p.x, e.y - p.y);
        if (d < 280 && d < bd) { bd = d; tg = e; }
      }
    }
    if (tg && bd < 950) {
      goto(tg.x, tg.y, 3.5);
      p.fuse = (p.fuse || 0) + dt;
      if (bd < tg.r + 20) {
        explode(p.x, p.y, S.boarR, S.boarDmg);
        p.hp = 0; p.dead = p.reviveMs; p.fuse = 0; SFX.dead();
        return;
      }
    } else if (Math.hypot(P.x - p.x, P.y - p.y) > 90) goto(P.x, P.y, 3.0);

  } else if (p.type === "chicken") {
    const hx = P.x - P.face * 42, hy = P.y + 24;
    if (Math.hypot(hx - p.x, hy - p.y) > 26) goto(hx, hy, 2.6);
    p.drop -= dt;
    if (p.drop <= 0 && eggs.length + chicks.length < S.eggCap) {
      p.drop = S.eggCd;
      eggs.push({ x: p.x - p.face * 12, y: p.y + 5, t: 2600, wob: 0 });
      beep(880, .06, "sine", .035, 180);
    }

  } else if (p.type === "mole") {
    p.timer -= dt;
    if (p.state === "up") {
      if (p.timer <= 0) {
        if (turrets.length < S.turCap)
          turrets.push({ x: p.x, y: p.y, life: 13000, cd: 0, a: 0 });
        p.state = "down"; p.timer = 850; SFX.build();
      }
    } else if (p.timer <= 0) {
      for (let i = 0; i < 20; i++) {
        const a = Math.random() * 6.283, d = rnd(90, 230);
        const nx = P.x + Math.cos(a) * d, ny = P.y + Math.sin(a) * d;
        if (nx < 40 || ny < 40 || nx > WORLD - 40 || ny > WORLD - 40) continue;
        if (props.some(o => Math.hypot(o.x - nx, o.y - ny) < o.r)) continue;
        p.x = nx; p.y = ny; break;
      }
      p.state = "up"; p.timer = 1500;
      for (let i = 0; i < 7; i++) {
        const a = Math.random() * 6.28;
        puffs.push({ x: p.x, y: p.y, vx: Math.cos(a) * 1.6, vy: Math.sin(a) * 1.6, life: .8, r: rnd(2, 4) });
      }
    }
  }

  if (p.dead > 0) return;
  pushOut(p);                             // питомец больше не ходит сквозь камни

  // урон питомцу
  for (const e of enemies) {
    if (Math.hypot(e.x - p.x, e.y - p.y) < e.r + p.r && p.hurt <= 0) {
      p.hp--; p.hurt = 900;
      pops.push({ x: p.x, y: p.y - 28, txt: "-1", life: .9, col: "#c8402c" });
      if (p.hp <= 0) {
        p.dead = p.reviveMs; SFX.dead();
        for (let i = 0; i < 14; i++) {
          const a = Math.random() * 6.28, sp = rnd(.8, 2.6);
          puffs.push({ x: p.x, y: p.y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 1, r: rnd(2, 5) });
        }
      }
      break;
    }
  }

  // турели крота
  for (const tu of turrets) {
    tu.life -= dt; if (tu.cd > 0) tu.cd -= dt;
    let b = null, bd = 240;
    for (const e of enemies) { const d = Math.hypot(e.x - tu.x, e.y - tu.y); if (d < bd) { bd = d; b = e; } }
    if (b) {
      tu.a = Math.atan2(b.y - tu.y, b.x - tu.x);
      if (tu.cd <= 0) {
        tu.cd = S.turCd; beep(660, .04, "square", .014, -220);
        shots.push({ x: tu.x + Math.cos(tu.a) * 14, y: tu.y - 6 + Math.sin(tu.a) * 14,
                     vx: Math.cos(tu.a) * 7, vy: Math.sin(tu.a) * 7, a: tu.a, life: 800, dmg: S.turDmg });
      }
    }
  }
  turrets = turrets.filter(tu => tu.life > 0);
}

function updateFarm(dt, k) {
  const S = P.pet ? petStats(P.pet) : null;
  for (const eg of eggs) {
    eg.t -= dt; eg.wob += dt / 110;
    if (eg.t <= 0) {
      eg.dead = true;
      chicks.push({ x: eg.x, y: eg.y, hp: 2, hurt: 0, life: 21000, cd: 0, phase: rnd(0, 6), face: 1 });
      beep(1150, .07, "triangle", .04, 260);
      for (let i = 0; i < 5; i++) {
        const a = Math.random() * 6.28;
        puffs.push({ x: eg.x, y: eg.y, vx: Math.cos(a) * 1.2, vy: Math.sin(a) * 1.2, life: .7, r: rnd(2, 3.5) });
      }
    }
  }
  eggs = eggs.filter(e => !e.dead);

  for (const ch of chicks) {
    ch.life -= dt; ch.phase += .34 * k;
    if (ch.cd > 0) ch.cd -= dt;
    if (ch.hurt > 0) ch.hurt -= dt;
    let tg = null, bd = 210;
    for (const e of enemies) {
      const d = Math.hypot(e.x - ch.x, e.y - ch.y);
      if (d < bd) { bd = d; tg = e; }
    }
    const go = (tx, ty, sp) => {
      const dx = tx - ch.x, dy = ty - ch.y, d = Math.hypot(dx, dy) || 1;
      if (d > 6) { ch.x += dx / d * sp * k; ch.y += dy / d * sp * k; ch.face = dx > 0 ? 1 : -1; }
      return d;
    };
    if (tg) {
      go(tg.x, tg.y, 2.7);
      if (bd < tg.r + 13 && ch.cd <= 0) {
        hit(tg, S ? S.chickDmg : .8, ch.x, ch.y); ch.cd = 620;
        beep(1300, .04, "square", .02, -300);
      }
    } else if (Math.hypot(P.x - ch.x, P.y - ch.y) > 90) go(P.x, P.y, 2.4);
    for (const e of enemies) {
      if (ch.hurt <= 0 && Math.hypot(e.x - ch.x, e.y - ch.y) < e.r + 8) {
        ch.hp--; ch.hurt = 700; break;
      }
    }
  }
  chicks = chicks.filter(c => c.hp > 0 && c.life > 0);
}

/* ── рисование питомцев ───────────────────────────────────── */
function drawPet(g, x, y, type, lvl, face, phase, p) {
  g.save(); g.translate(x, y); g.lineCap = "round"; g.lineJoin = "round";
  g.strokeStyle = INK; g.lineWidth = 2.2;
  const sw = Math.sin(phase) * .5;
  const col = TIER[Math.min(4, lvl - 1)];

  if (type === "dog") {
    g.save(); g.scale(face, 1);
    const wag = Math.sin(phase * 2) * 5;
    sline(g, -13, -15, -21, -23 + wag);                    // хвост
    sline(g, -9, -6, -10 + sw * 5, 2);                     // задние лапы
    sline(g, -6, -6, -7 - sw * 5, 2);
    spoly(g, [[-14, -17], [9, -18], [11, -7], [-13, -6]], "#c99a5f");   // корпус
    sline(g, 7, -6, 8 - sw * 5, 2);                        // передние лапы
    sline(g, 4, -6, 5 + sw * 5, 2);
    sline(g, 9, -16, 14, -21);                             // шея
    scircle(g, 17, -24, 5.6, "#dcae72");                   // голова
    spoly(g, [[20, -26], [28, -23], [20, -20]], "#c99a5f");// морда
    spoly(g, [[13, -27], [15, -34], [19, -28]], "#a8783f");// ухо
    g.fillStyle = INK;
    g.beginPath(); g.arc(19, -26, .9, 0, 7); g.fill();     // глаз
    g.beginPath(); g.arc(27.5, -23, 1.3, 0, 7); g.fill();  // нос
    g.strokeStyle = col; g.lineWidth = 3;                  // ошейник, цвет по уровню
    sline(g, 11, -19, 14, -14);
    if (lvl >= 3) { g.lineWidth = 1.8; for (let i = 0; i < 3; i++) sline(g, 11.5 + i * 1.1, -18 + i * 1.6, 14.5 + i * 1.1, -19 + i * 1.6); }
    g.strokeStyle = INK; g.lineWidth = 2.2;
    if (p && p.bite > 0) {                                 // укус
      const k2 = p.bite / 220;
      g.strokeStyle = "#c8402c"; g.lineWidth = 2.6;
      g.beginPath(); g.arc(30, -23, 9 + (1 - k2) * 7, -1.1, 1.1); g.stroke();
      g.beginPath(); g.arc(30, -23, 14 + (1 - k2) * 8, -.8, .8); g.stroke();
      g.lineWidth = 2; g.strokeStyle = INK;
      for (let i = -1; i <= 1; i++) sline(g, 28, -23 + i * 6, 34, -23 + i * 8);
    }
    g.restore();

  } else if (type === "cat") {
    g.save(); g.scale(face, 1);
    spoly(g, [[-10, -12], [8, -12], [9, -4], [-10, -4]], "#9aa3ab");
    sline(g, -7, -4, -8 + sw * 4, 3); sline(g, 4, -4, 5 - sw * 4, 3);
    sline(g, -10, -11, -18, -17);
    scircle(g, 12, -16, 5, "#aab3ba");
    spoly(g, [[9, -20], [10, -25], [13, -20]], "#8c959d");
    spoly(g, [[13, -20], [16, -25], [16, -19]], "#8c959d");
    g.restore();
    g.save(); g.translate(0, -14); g.rotate(face > 0 ? (p ? p.aim : 0) : Math.PI - (p ? p.aim : 0)); g.scale(face, 1);
    spoly(g, [[-4, -4], [6, -4], [6, 1], [-4, 1]], col);
    spoly(g, [[6, -3], [16 + lvl, -3], [16 + lvl, -.6], [6, -.6]], col);
    g.restore();

  } else if (type === "parrot") {
    g.save(); g.scale(face, 1);
    const fl = Math.sin(phase * 2.4) * 7;
    spoly(g, [[-8, -14], [6, -16], [7, -7], [-7, -6]], col);
    sline(g, -8, -14, -18, -20 - fl);
    sline(g, -8, -12, -17, -12 + fl);
    scircle(g, 9, -19, 4.6, "#f0d98a");
    spoly(g, [[12, -20], [17, -18], [12, -16]], "#e08a2a");
    sline(g, -7, -9, -15, -4);
    g.restore();
    g.globalAlpha = .18; g.fillStyle = INK;
    g.beginPath(); g.ellipse(0, 12, 9, 3, 0, 0, 7); g.fill(); g.globalAlpha = 1;

  } else if (type === "boar") {
    g.save(); g.scale(face, 1);
    spoly(g, [[-15, -18], [8, -20], [12, -6], [-14, -5]], "#6f5b4a");     // туша
    sline(g, -9, -5, -10 + sw * 4, 3); sline(g, -5, -5, -6 - sw * 4, 3);
    sline(g, 5, -6, 6 - sw * 4, 3); sline(g, 9, -6, 10 + sw * 4, 3);
    scircle(g, 15, -20, 6, "#7d6754");                                     // голова
    spoly(g, [[19, -22], [27, -19], [19, -15]], "#5a4839");                // рыло
    spoly(g, [[20, -18], [25, -25], [21, -16]], "#efe6d2");                // клык
    spoly(g, [[11, -25], [13, -31], [17, -25]], "#5a4839");                // ухо
    g.fillStyle = INK; g.beginPath(); g.arc(17, -22, .9, 0, 7); g.fill();
    spoly(g, [[-10, -24], [0, -26], [1, -18], [-9, -16]], "#c8402c");      // динамит
    for (let i = 0; i < 2; i++) sline(g, -8 + i * 4, -25, -8 + i * 4, -17);
    g.strokeStyle = "#8a7355"; sline(g, -5, -26, -9, -33);                 // фитиль
    const spark = 2 + Math.abs(Math.sin(phase * 3)) * (1.6 + lvl * .5);
    g.fillStyle = "#e08a2a";
    g.beginPath(); g.arc(-9, -33, spark, 0, 7); g.fill();
    g.strokeStyle = INK;
    g.restore();

  } else if (type === "chicken") {
    g.save(); g.scale(face, 1);
    g.translate(0, Math.sin(phase * 2) * 1.3);
    for (let i = 0; i < 3; i++) {                                  // хвост из перьев
      const a2 = -.5 - i * .38;
      spoly(g, [[-11, -13], [-11 + Math.cos(a2) * 15, -13 + Math.sin(a2) * 15],
                [-9 + Math.cos(a2) * 13, -9 + Math.sin(a2) * 13]], i % 2 ? "#e9e0cc" : "#f6f1e4");
    }
    g.beginPath(); g.ellipse(-1, -13, 12, 10.5, -.12, 0, 7);       // тело
    g.fillStyle = "#f8f3e6"; g.fill(); g.stroke();
    g.beginPath(); g.ellipse(-2, -12, 7, 5, .25, 0, 7);            // крыло
    g.fillStyle = "#ece3d0"; g.fill(); g.stroke();
    g.lineWidth = 1.5; sline(g, -6, -11, 1, -13); sline(g, -6, -9, 1, -11);
    g.strokeStyle = "#e08a2a"; g.lineWidth = 2.2;                  // лапы
    const st = Math.sin(phase * 2) * 3;
    sline(g, -3, -4, -4 + st, 4); sline(g, 3, -4, 4 - st, 4);
    sline(g, -4 + st, 4, -8 + st, 5); sline(g, -4 + st, 4, -6 + st, 6.5);
    sline(g, 4 - st, 4, 8 - st, 5); sline(g, 4 - st, 4, 6 - st, 6.5);
    g.strokeStyle = INK;
    sline(g, 7, -18, 9, -23);                                      // шея
    g.beginPath(); g.ellipse(10, -26, 5.4, 5, .1, 0, 7);           // голова
    g.fillStyle = "#fbf7ec"; g.fill(); g.stroke();
    spoly(g, [[5, -30], [6.5, -35], [8.5, -30.5], [10.5, -36], [12.5, -30.5],
              [14, -34], [14.5, -29]], "#d2412c");                 // гребень
    spoly(g, [[13, -24], [15.5, -30], [16, -23]], "#e08a2a");      // клюв
    spoly(g, [[9, -21], [11.5, -16], [7.5, -19]], "#d2412c");      // бородка
    g.fillStyle = INK; g.beginPath(); g.arc(11.6, -27, 1, 0, 7); g.fill();
    g.restore();

  } else if (type === "mole") {
    if (p && p.state === "down") {
      spoly(g, [[-17, 3], [-9, -9], [9, -9], [17, 3]], "#a98055");     // холмик земли
      g.lineWidth = 1.6;
      sline(g, -8, 1, -4, -4); sline(g, 2, 1, 6, -4); sline(g, -1, 2, 0, -6);
      g.lineWidth = 2.2;
    } else {
      g.save(); g.scale(face, 1);
      g.beginPath(); g.ellipse(-2, -12, 13, 10, -.08, 0, 7);           // тело
      g.fillStyle = "#8d6b4e"; g.fill(); g.stroke();
      g.lineWidth = 2; sline(g, -8, -3, -10, 2); sline(g, -2, -3, -3, 2);
      g.lineWidth = 2.2;
      g.beginPath(); g.ellipse(10, -14, 7, 6.5, .05, 0, 7);            // морда
      g.fillStyle = "#9b7857"; g.fill(); g.stroke();
      spoly(g, [[15, -17], [23, -14], [15, -11]], "#e0a0a0");          // нос-лопатка
      g.fillStyle = INK; g.beginPath(); g.arc(21, -14, 1.1, 0, 7); g.fill();
      g.lineWidth = 1.5;                                               // усы и прищур
      sline(g, 17, -12, 23, -9); sline(g, 17, -11, 23, -7); sline(g, 17, -16, 23, -18);
      g.lineWidth = 1.8; sline(g, 8, -18, 12, -18);
      g.lineWidth = 2.2;
      spoly(g, [[6, -8], [13, -6], [12, 0], [5, -2]], "#7a5b41");      // лапа-копалка
      g.lineWidth = 1.5;
      for (let i = 0; i < 3; i++) sline(g, 12, -5 + i * 2.4, 17, -6 + i * 2.4);
      g.lineWidth = 2.2;
      g.fillStyle = col;                                               // каска по уровню
      g.beginPath(); g.arc(4, -20, 8, Math.PI, 0); g.fill(); g.stroke();
      sline(g, -4, -20, 13, -20);
      if (lvl >= 3) { g.fillStyle = "#f7e08a"; g.beginPath(); g.arc(9, -23, 2.6, 0, 7); g.fill(); g.stroke(); }
      g.restore();
    }
  }
  g.restore();
}

function drawItemIcon(g, key, x, y, sc) {
  g.save(); g.translate(x, y); g.scale(sc, sc);
  g.strokeStyle = INK; g.lineWidth = 2.2; g.lineJoin = "round"; g.lineCap = "round";
  if (key === "nade") {                                   // граната-лимонка
    g.beginPath(); g.ellipse(0, 1, 8, 9, 0, 0, 7);
    g.fillStyle = "#4e8f4a"; g.fill(); g.stroke();
    g.lineWidth = 1.3;
    for (let i = -1; i <= 1; i++) { sline(g, -7, i * 4.5, 7, i * 4.5); sline(g, i * 4.5, -7, i * 4.5, 8); }
    g.lineWidth = 2.2;
    spoly(g, [[-4, -8], [4, -8], [3, -12], [-3, -12]], "#6f6a5a");   // горловина
    sline(g, 3, -12, 8, -6);                                          // рычаг
    g.beginPath(); g.arc(-5, -13, 3, 0, 7); g.stroke();               // кольцо
  } else if (key === "mine") {                            // мина с усиками
    for (let i = 0; i < 6; i++) {
      const a = -Math.PI + i * Math.PI / 5;
      sline(g, Math.cos(a) * 6, Math.sin(a) * 6 - 1, Math.cos(a) * 11, Math.sin(a) * 11 - 2);
    }
    g.beginPath(); g.arc(0, 0, 7.5, 0, 7);
    g.fillStyle = "#c8402c"; g.fill(); g.stroke();
    g.fillStyle = "#ffe0b0"; g.beginPath(); g.arc(0, 0, 2.6, 0, 7); g.fill();
  } else if (key === "ice") {                             // снежинка
    g.strokeStyle = "#3f97bd"; g.lineWidth = 2.4;
    for (let i = 0; i < 3; i++) {
      const a = i * Math.PI / 3;
      sline(g, -Math.cos(a) * 10, -Math.sin(a) * 10, Math.cos(a) * 10, Math.sin(a) * 10);
      sline(g, Math.cos(a) * 6, Math.sin(a) * 6, Math.cos(a) * 6 + Math.cos(a + 1) * 4.5, Math.sin(a) * 6 + Math.sin(a + 1) * 4.5);
      sline(g, -Math.cos(a) * 6, -Math.sin(a) * 6, -Math.cos(a) * 6 - Math.cos(a + 1) * 4.5, -Math.sin(a) * 6 - Math.sin(a + 1) * 4.5);
    }
    g.strokeStyle = INK;
  } else {                                                // кристалл опыта
    spoly(g, [[0, -11], [7, -2], [4, 9], [-4, 9], [-7, -2]], "#e8c247");
    g.lineWidth = 1.4;
    sline(g, 0, -11, 0, 9); sline(g, -7, -2, 7, -2);
    g.lineWidth = 2.2;
  }
  g.restore();
}

function drawEgg(g, e) {

function drawChick(g, c) {

}
function drawTurret(g, tu) {

  scircle(g, 0, -7, 6, "#c9b48f");
  g.save(); g.rotate(tu.a);
  spoly(g, [[3, -9], [17, -8.6], [17, -5.6], [3, -5]], "#7b6a52");

}

/* ── состояние ────────────────────────────────────────────── */
const P = {};
let enemies, shots, orbs, puffs, pops, props, chests, mines, nades, ices, booms, pickups, corpses;
let running, paused, t, spawnT, shotT, eliteT, chestT, healT, score, shake, pointer, xpBoost;
const rnd = (a, b) => a + Math.random() * (b - a);
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);

function buildProps() {
  props = [];
  for (let i = 0; i < 70; i++) {
    const kind = Math.random() < .5 ? "rock" : Math.random() < .7 ? "bush" : "tree";
    const r = kind === "rock" ? rnd(24, 50) : kind === "bush" ? rnd(22, 38) : rnd(26, 34);
    const x = rnd(r, WORLD - r), y = rnd(r, WORLD - r);
    if (Math.hypot(x - WORLD / 2, y - WORLD / 2) < 280) continue;
    // форма запоминается один раз, чтобы не дёргалась каждый кадр
    const pts = [];
    const n = kind === "rock" ? 7 : 6;
    for (let j = 0; j < n; j++) {
      const a = j / n * 6.283, rr = r * (.78 + hash(x + j, y) * .34);
      pts.push([Math.cos(a) * rr, Math.sin(a) * rr]);
    }
    props.push({ x, y, r, kind, pts, seed: hash(x, y) });
  }
}

function reset() {
  Object.assign(P, {
    x: WORLD / 2, y: WORLD / 2, r: 14, phase: 0, face: 1, hurt: 0, orbA: 0,
    aim: 0, muzzle: 0, hp: 5 + meta.hp, lvl: 1, xp: 0, xpNext: 5,
    gear: Object.fromEntries(GK.map(k => [k, 0])), item: null, pet: null, wtype: "basic",
  });
  turrets = []; eggs = []; chicks = []; pendingPet = null; lastPetRoll = null; queuedLevels = 0;
  enemies = []; shots = []; orbs = []; puffs = []; pops = [];
  chests = []; mines = []; nades = []; ices = []; booms = []; pickups = []; corpses = [];
  buildProps();
  t = 0; spawnT = 0; shotT = 0; eliteT = 45000; chestT = 6000; healT = 14000;
  score = 0; shake = 0; xpBoost = 0; paused = false;
  pointer = { x: P.x, y: P.y, active: false };
  applyGear();
}
function applyGear() {
  const g = P.gear, L = g.gun, w = P.wtype;
  const dm = 1 + .15 * meta.dmg;

  if (w === "shotgun") {
    P.rate = 880; P.damage = (.42 + .11 * L) * dm;
    P.range = 168 + 34 * g.scope; P.pellets = 5 + L + g.clip;
    P.spread = .52; P.pierce = 0; P.nShots = 1;
  } else if (w === "sniper") {
    P.rate = 1550 - 140 * L; P.damage = (3.2 + 2.3 * L) * dm;
    P.range = 520 + 110 * g.scope; P.pellets = 1;
    P.spread = 0; P.pierce = 1; P.nShots = 1 + g.clip;
  } else if (w === "minigun") {
    P.rate = 205 - 21 * L; P.damage = (.46 + .23 * L) * dm;
    P.range = 205 + 42 * g.scope; P.pellets = 1;
    P.spread = .17; P.pierce = 0; P.nShots = 1;
  } else {
    P.rate = 620; P.damage = (1 + L) * dm;
    P.range = 215 + 55 * g.scope; P.pellets = 1;
    P.spread = 0; P.pierce = 0; P.nShots = 1 + g.clip;
  }
  P.fireRate = Math.max(60, P.rate * Math.pow(.86, g.gloves));

  P.speed = (2.15 + .42 * g.boots) * (1 + .08 * meta.spd);
  P.hpMax = 5 + meta.hp + g.helm;
  P.magnet = 120 + 75 * g.cape;
  P.iframe = 950 + 320 * g.jacket;
  P.hp = Math.min(P.hp, P.hpMax);
}

/* ── ввод ─────────────────────────────────────────────────── */
const LIFT = 78;
function toWorld(e) {
  const r = cv.getBoundingClientRect();
  const sx = e.clientX - r.left, sy = e.clientY - r.top;
  const lift = e.pointerType === "mouse" ? 0 : LIFT;
  return { sx, sy, x: sx + cam.x, y: sy - lift + cam.y };
}
cv.addEventListener("pointerdown", e => {
  audio(); const p = toWorld(e);
  pointer.x = p.x; pointer.y = p.y; pointer.active = true;
  cv.setPointerCapture(e.pointerId);
});
cv.addEventListener("pointermove", e => {
  const p = toWorld(e); pointer.x = p.x; pointer.y = p.y;
  if (e.pointerType === "mouse") pointer.active = true;
});
cv.addEventListener("pointerup", e => { if (e.pointerType !== "mouse") pointer.active = false; });
addEventListener("keydown", e => {
  if (e.code === "Space" || e.code === "KeyE") { e.preventDefault(); useItem(); }
  if (e.code === "Escape" || e.code === "KeyP") { e.preventDefault(); userPaused ? resumeGame() : pauseGame(); }

let userPaused = false;

    `LV ${P.lvl} · ${(t / 1000).toFixed(0)} с · лопнул ${score}`;

}
function resumeGame() {

// вкладку свернули — ставим паузу и показываем окно, иначе игра зависала навсегда
document.addEventListener("visibilitychange", () => { if (document.hidden) pauseGame(); });

/* ── враги ────────────────────────────────────────────────── */
const KINDS = {
  basic:  { r: 11, hp: 1,  spd: .76, xp: 1 },
  runner: { r: 9,  hp: 1,  spd: 1.5, xp: 1 },
  tank:   { r: 17, hp: 6,  spd: .46, xp: 3 },
  elite:  { r: 25, hp: 28, spd: .54, xp: 10 },
};
function spawn(kind) {
  const K = KINDS[kind], a = Math.random() * 6.283, d = Math.max(W, H) * .62 + 60;
  const x = Math.max(30, Math.min(WORLD - 30, P.x + Math.cos(a) * d));
  const y = Math.max(30, Math.min(WORLD - 30, P.y + Math.sin(a) * d));
  const grow = 1 + t / 90000, hp = Math.ceil(K.hp * grow);
  enemies.push({ kind, x, y, r: K.r, xp: K.xp, hp, maxhp: hp,
    speed: K.spd + Math.min(.4, t / 160000), phase: rnd(0, 6),
    face: 1, flash: 0, kb: 0, kbx: 0, kby: 0, orbCd: 0, slip: 0,
    lx: x, ly: y, stuckT: 0, wander: 0, wanderT: 0, bob: rnd(0, 6) });
}
function popEnemy(e) {
  // у каждого типа своя смерть
  const c = { kind: e.kind, x: e.x, y: e.y, face: e.face, sc: e.r / 11,
              rot: 0, rotV: 0, vx: e.kbx * 2.4, vy: e.kby * 2.4,
              life: 1, max: 1, mode: "puff", phase: e.phase };
  if (e.kind === "runner") {                       // кувыркается и тает
    c.mode = "tumble"; c.rotV = (Math.random() < .5 ? -1 : 1) * .14;
    c.vx = e.kbx * 4.2 + rnd(-.6, .6); c.vy = e.kby * 4.2 - 1.9; c.max = 1.25; c.life = 1.25;
  } else if (e.kind === "tank") {                  // тяжело заваливается набок
    c.mode = "fall"; c.max = 1.6; c.life = 1.6;
  } else if (e.kind === "elite") {                 // разлетается с ударной волной
    c.mode = "blast"; c.max = 1.2; c.life = 1.2;
    booms.push({ x: e.x, y: e.y, r: 14, max: 150, life: 1 });
    booms.push({ x: e.x, y: e.y, r: 8, max: 96, life: .8 });
    shake = Math.max(shake, 20);
  } else {                                         // обычный просто лопается
    c.mode = "pop"; c.max = .34; c.life = .34;
  }
  corpses.push(c);
  if (corpses.length > 40) corpses.shift();

  for (let i = 0; i < (e.kind === "elite" ? 24 : 8); i++) {
    const a = Math.random() * 6.28, s = rnd(.6, 3);
    puffs.push({ x: e.x, y: e.y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 1, r: rnd(2, 5) });
  }
  for (let i = 0; i < e.xp; i++) orbs.push({ x: e.x + rnd(-14, 14), y: e.y + rnd(-14, 14), vx: 0, vy: 0 });
  score++; shake = Math.max(shake, e.kind === "elite" ? 16 : 3); SFX.pop();
}
function hit(e, dmg, hx, hy) {
  e.hp -= dmg; e.flash = 110;
  if (hx !== undefined) { const a = Math.atan2(e.y - hy, e.x - hx); e.kb = 3.4; e.kbx = Math.cos(a); e.kby = Math.sin(a); }
  pops.push({ x: e.x, y: e.y - e.r - 10, txt: Math.round(dmg * 10) / 10, life: 1, col: INK });
  if (e.hp <= 0) popEnemy(e);
}

/* ── предметы ─────────────────────────────────────────────── */
function useItem() {
  if (!running || paused || !P.item) return;
  const it = P.item; P.item = null;
  if (it === "mine") mines.push({ x: P.x, y: P.y, arm: 700 });
  else if (it === "nade") {
    let tg = null, bd = 1e9;
    for (const e of enemies) { const d = dist(e, P); if (d < bd) { bd = d; tg = e; } }
    const a = tg ? Math.atan2(tg.y - P.y, tg.x - P.x) : P.aim;
    nades.push({ x: P.x, y: P.y, vx: Math.cos(a) * 5.5, vy: Math.sin(a) * 5.5, fuse: 700 });
  } else if (it === "ice") { ices.push({ x: P.x, y: P.y, r: 150, life: 11000 }); SFX.ice(); }
  else if (it === "xp") { xpBoost = 20000; SFX.chest(); }
}
function explode(x, y, r, dmg) {
  booms.push({ x, y, r: 10, max: r, life: 1 });
  shake = Math.max(shake, 14); SFX.boom();
  for (const e of enemies) if (Math.hypot(e.x - x, e.y - y) < r + e.r) hit(e, dmg, x, y);
  for (let i = 0; i < 16; i++) {
    const a = Math.random() * 6.28, s = rnd(1, 4);
    puffs.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 1, r: rnd(3, 7) });
  }
}
function spawnChest() {
  if (chests.length >= 3) return;
  for (let i = 0; i < 30; i++) {
    const a = Math.random() * 6.283, d = rnd(260, 620);
    const x = P.x + Math.cos(a) * d, y = P.y + Math.sin(a) * d;
    if (x < 60 || y < 60 || x > WORLD - 60 || y > WORLD - 60) continue;
    if (props.some(o => Math.hypot(o.x - x, o.y - y) < o.r + 40)) continue;
    const r = Math.random();
    chests.push({ x, y, a: 0, item: r < .10 ? "xp" : r < .40 ? "mine" : r < .72 ? "nade" : "ice" });
    return;
  }
}
const BOOSTS = {
  heart: { w: 5, col: "#c8402c" },
  haste: { w: 3, col: "#e0a52f" },
  ghost: { w: 3, col: "#4aa8cf" },
};
function rollBoost() {
  const keys = Object.keys(BOOSTS);
  let total = keys.reduce((a, k) => a + BOOSTS[k].w, 0), r = Math.random() * total;
  for (const k of keys) { r -= BOOSTS[k].w; if (r <= 0) return k; }
  return "heart";
}
function spawnHeart() {
  if (pickups.length >= 4) return;
  for (let i = 0; i < 30; i++) {
    const a = Math.random() * 6.283, d = rnd(230, 640);
    const x = P.x + Math.cos(a) * d, y = P.y + Math.sin(a) * d;
    if (x < 60 || y < 60 || x > WORLD - 60 || y > WORLD - 60) continue;
    if (props.some(o => Math.hypot(o.x - x, o.y - y) < o.r + 34)) continue;
    pickups.push({ x, y, a: Math.random() * 6, kind: rollBoost() });
    return;
  }
}
function drawPickup(g, p) {
  const y = p.y - 4 + Math.sin(p.a) * 5;
  if (p.kind === "heart") { drawHeart(g, p.x, y, 1.4); return; }
  g.save(); g.translate(p.x, y);
  g.lineWidth = 2.4; g.lineJoin = "round";
  if (p.kind === "haste") {
    g.strokeStyle = "#a8761a";
    spoly(g, [[-3, -12], [6, -12], [1, -2], [7, -2], [-5, 12], [-1, 0], [-6, 0]], "#f0c443");
  } else {
    g.strokeStyle = "#2f7d9c";
    spoly(g, [[0, -13], [10, -8], [10, 2], [0, 13], [-10, 2], [-10, -8]], "#a9dcf0");
    g.lineWidth = 1.6; g.strokeStyle = "#2f7d9c";
    sline(g, 0, -9, 0, 8); sline(g, -6, -1, 6, -1);
  }
  g.restore();
}
function drawHeart(g, x, y, s2) {
  g.save(); g.translate(x, y); g.scale(s2, s2);
  g.strokeStyle = "#c8402c"; g.lineWidth = 2.4; g.fillStyle = "#f0a79a";
  g.beginPath();
  g.moveTo(0, 7); g.bezierCurveTo(-11, -1, -7, -11, 0, -5);
  g.bezierCurveTo(7, -11, 11, -1, 0, 7);
  g.closePath(); g.fill(); g.stroke();
  g.restore();
}
function pushOut(o) {
  for (const r of props) {
    const dx = o.x - r.x, dy = o.y - r.y, d = Math.hypot(dx, dy), m = r.r * .78 + o.r;
    if (d < m && d > .01) { o.x = r.x + dx / d * m; o.y = r.y + dy / d * m; }
  }
  o.x = Math.max(o.r, Math.min(WORLD - o.r, o.x));
  o.y = Math.max(o.r, Math.min(WORLD - o.r, o.y));
}

/* ── цикл ─────────────────────────────────────────────────── */
let last = 0;
requestAnimationFrame(function loop(now) {
  requestAnimationFrame(loop);
  const dt = Math.min(34, now - last); last = now;
  if (running && !paused) update(dt);
  draw();
});

function update(dt) {
  t += dt; const k = dt / 16.67;
  if (shake > 0) shake = Math.max(0, shake - dt * .045);
  if (xpBoost > 0) xpBoost -= dt;
  if (P.muzzle > 0) P.muzzle -= dt;
  if (P.hasteT > 0) P.hasteT -= dt;
  if (P.invT > 0) P.invT -= dt;

  if (pointer.active) {
    const dx = pointer.x - P.x, dy = pointer.y - P.y, d = Math.hypot(dx, dy);
    if (d > 5) {
      const hs = P.hasteT > 0 ? 1.6 : 1;
      const v = Math.min(P.speed * hs * k, d);
      P.x += dx / d * v; P.y += dy / d * v; P.phase += .27 * hs * k;
      if (Math.abs(dx) > 1) P.face = dx > 0 ? 1 : -1;
    }
  }
  pushOut(P);
  if (P.hurt > 0) P.hurt -= dt;
  P.orbA += .055 * k;
  cam.x = Math.max(0, Math.min(WORLD - W, P.x - W / 2));
  cam.y = Math.max(0, Math.min(WORLD - H, P.y - H / 2));

  spawnT -= dt;
  if (spawnT <= 0 && enemies.length < 140) {
    spawnT = Math.max(170, 860 - t / 85);
    const r = Math.random();
    spawn(t > 25000 && r < .28 ? "runner" : t > 55000 && r > .90 ? "tank" : "basic");
  }
  eliteT -= dt; if (eliteT <= 0) { eliteT = 45000; spawn("elite"); shake = 10; }
  chestT -= dt; if (chestT <= 0) { chestT = 13000 - meta.luck * 2200; spawnChest(); }
  healT -= dt; if (healT <= 0) { healT = 15000; spawnHeart(); }

  for (const h of pickups) {
    h.a += .05 * k;
    if (dist(h, P) >= 34) continue;
    h.dead = true;
    if (h.kind === "heart") {
      if (P.hp < P.hpMax) { P.hp++; pops.push({ x: P.x, y: P.y - 52, txt: "+1", life: 1.2, col: "#c8402c" }); }
      else for (let i = 0; i < 3; i++) orbs.push({ x: P.x + rnd(-20, 20), y: P.y + rnd(-20, 20), vx: 0, vy: 0 });
      SFX.heal();
    } else if (h.kind === "haste") {
      P.hasteT = 7000;
      pops.push({ x: P.x, y: P.y - 52, txt: "УСКОРЕНИЕ", life: 1.4, col: "#a8761a" });
      chain([700, 900, 1200], "square", .05);
    } else {
      P.invT = 6000; P.seen = { x: P.x, y: P.y };
      pops.push({ x: P.x, y: P.y - 52, txt: "НЕУЯЗВИМОСТЬ", life: 1.4, col: "#2f7d9c" });
      chain([500, 700, 990], "sine", .055);
    }
  }
  pickups = pickups.filter(h => !h.dead);

  for (const ic of ices) ic.life -= dt;
  ices = ices.filter(i => i.life > 0);

  for (const e of enemies) {
    let slow = 1;
    for (const ic of ices) if (Math.hypot(e.x - ic.x, e.y - ic.y) < ic.r) {
      slow = .34; e.slip = 1; e.hp -= dt / 1000 * 1.4;
    }
    if (e.hp <= 0) { popEnemy(e); continue; }
    if (e.kb > 0) { e.x += e.kbx * e.kb * k; e.y += e.kby * e.kb * k; e.kb *= .82; }
    else {
      const tx = P.invT > 0 ? P.seen.x : P.x, ty = P.invT > 0 ? P.seen.y : P.y;
      const dx = tx - e.x, dy = ty - e.y, d = Math.hypot(dx, dy) || 1;
      let vx = dx / d, vy = dy / d;
      if (P.invT > 0) { vx += Math.cos(t / 300 + e.bob) * .5; vy += Math.sin(t / 300 + e.bob) * .5; }

      // если застрял — на секунду уходим вбок, пока не выберемся
      e.stuckT += dt;
      if (e.stuckT > 420) {
        const moved = Math.hypot(e.x - e.lx, e.y - e.ly);
        if (moved < 5 && e.wanderT <= 0) {
          e.wanderT = 750;
          e.wander = Math.atan2(dy, dx) + (Math.random() < .5 ? 1.5 : -1.5);
        }
        e.lx = e.x; e.ly = e.y; e.stuckT = 0;
      }
      if (e.wanderT > 0) {
        e.wanderT -= dt;
        vx = Math.cos(e.wander); vy = Math.sin(e.wander);
      } else {
        // обход препятствий: смотрим дальше вперёд и отворачиваем сильнее
        for (const o of props) {
          const ox = o.x - e.x, oy = o.y - e.y, od = Math.hypot(ox, oy);
          const reach = o.r * .78 + e.r + 44;
          if (od > reach || od < .01) continue;
          if (ox / od * vx + oy / od * vy < -.05) continue;
          const side = (ox * vy - oy * vx) > 0 ? -1 : 1;
          const w = (1 - od / reach) * 3.0;
          vx += -oy / od * side * w; vy += ox / od * side * w;
        }
      }
      const j = e.slip > 0 ? rnd(-.6, .6) : 0;
      const vl = Math.hypot(vx, vy) || 1;
      e.x += (vx / vl + j) * e.speed * slow * k;
      e.y += (vy / vl + j) * e.speed * slow * k;
      e.face = dx > 0 ? 1 : -1;
    }
    const anim = e.kind === 'runner' ? .30 : e.kind === 'tank' ? .13 : e.kind === 'elite' ? .17 : .23;
    e.phase += (anim * slow + (e.slip > 0 ? .3 : 0)) * k;
    if (e.slip > 0) e.slip -= dt / 500;
    if (e.flash > 0) e.flash -= dt;
    if (e.orbCd > 0) e.orbCd -= dt;
    pushOut(e);
    if (dist(e, P) < P.r + e.r && P.hurt <= 0 && P.invT <= 0) {
      P.hp--; P.hurt = P.iframe; shake = 12; SFX.hurt();
      pops.push({ x: P.x, y: P.y - 40, txt: "-1", life: 1, col: FOE });
      if (P.hp <= 0) return gameOver();
    }
  }
  // мягкое расталкивание через сетку, иначе толпа слипается и стоит
  const cell = 48, grid = new Map();
  for (const e of enemies) {
    const key = ((e.x / cell) | 0) + "," + ((e.y / cell) | 0);
    (grid.get(key) || grid.set(key, []).get(key)).push(e);
  }
  for (const e of enemies) {
    const cx2 = (e.x / cell) | 0, cy2 = (e.y / cell) | 0;
    for (let a = -1; a <= 1; a++) for (let b = -1; b <= 1; b++) {
      const list = grid.get((cx2 + a) + "," + (cy2 + b)); if (!list) continue;
      for (const o of list) {
        if (o === e) continue;
        const dx = e.x - o.x, dy = e.y - o.y, d = Math.hypot(dx, dy), m = e.r + o.r;
        if (d < m && d > .01) {
          const push = (m - d) * .35;
          e.x += dx / d * push; e.y += dy / d * push;
        }
      }
    }
  }
  enemies = enemies.filter(e => e.hp > 0);

  updatePet(dt, k);
  updateFarm(dt, k);

  for (const m of mines) {
    if (m.arm > 0) { m.arm -= dt; continue; }
    for (const e of enemies) if (Math.hypot(e.x - m.x, e.y - m.y) < e.r + (m.mini ? 18 : 26)) { m.dead = true; explode(m.x, m.y, m.mini ? 72 : 130, m.mini ? m.dmg : 9); break; }
  }
  mines = mines.filter(m => !m.dead);
  for (const g of nades) {
    g.x += g.vx * k; g.y += g.vy * k; g.vx *= .965; g.vy *= .965; g.fuse -= dt;
    if (g.fuse <= 0) { g.dead = true; explode(g.x, g.y, 155, 7); }
  }
  nades = nades.filter(g => !g.dead);

  // прицеливание и выстрел из ствола
  const near = enemies.map(e => ({ e, d: dist(e, P) })).filter(o => o.d < P.range)
    .sort((a, b) => a.d - b.d).slice(0, P.nShots);
  if (near.length) {
    const tg = near[0].e;
    P.aim = Math.atan2(tg.y - (P.y - 11), tg.x - P.x);
    P.face = Math.cos(P.aim) > 0 ? 1 : -1;
  }
  shotT -= dt;
  if (shotT <= 0 && near.length) {
    shotT = P.fireRate * (P.hasteT > 0 ? .55 : 1); SFX.shot(); P.muzzle = P.wtype === "minigun" ? 60 : 100;
    const mk = (a, dmg, kind) => {
      const mx = P.x + Math.cos(a) * 34, my = P.y - 11 + Math.sin(a) * 34;
      const sp = kind === "sniper" ? 13 : kind === "pellet" ? 7.4 : 7.2;
      shots.push({ x: mx, y: my, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
                   a, life: kind === "sniper" ? 1400 : 850, dmg, kind,
                   pierce: kind === "sniper", hit: [] });
    };
    const ang = e => Math.atan2(e.y - (P.y - 11), e.x - P.x);
    if (P.wtype === "shotgun") {
      const a0 = ang(near[0].e);
      for (let i = 0; i < P.pellets; i++)
        mk(a0 + (i / (P.pellets - 1) - .5) * P.spread + rnd(-.05, .05), P.damage, "pellet");
      P.recoil = 1;
    } else if (P.wtype === "minigun") {
      mk(ang(near[0].e) + rnd(-P.spread, P.spread) / 2, P.damage, "mini");
      P.spin = (P.spin || 0) + 1.1;
    } else if (P.wtype === "sniper") {
      for (const { e } of near) mk(ang(e), P.damage, "sniper");
      shake = Math.max(shake, 7); P.recoil = 1;
    } else {
      for (const { e } of near) mk(ang(e), P.damage, "basic");
    }
  }
  for (const s of shots) {
    s.x += s.vx * k; s.y += s.vy * k; s.life -= dt;
    for (const e of enemies) {
      if (e.hp <= 0 || Math.hypot(e.x - s.x, e.y - s.y) > e.r + 4) continue;
      if (s.pierce) {
        if (s.hit.includes(e)) continue;
        s.hit.push(e); hit(e, s.dmg || P.damage, s.x, s.y);
      } else { hit(e, s.dmg || P.damage, s.x, s.y); s.life = 0; break; }
    }
  }
  shots = shots.filter(s => s.life > 0);
  enemies = enemies.filter(e => e.hp > 0);

  for (const c of chests) {
    c.a += .04 * k;
    if (dist(c, P) < 42) { c.dead = true; P.item = c.item; SFX.chest();
      pops.push({ x: P.x, y: P.y - 48, txt: ITEMS[c.item].name, life: 1.4, col: ITEMS[c.item].col }); }
  }
  chests = chests.filter(c => !c.dead);

  for (const o of orbs) {
    const dx = P.x - o.x, dy = P.y - o.y, d = Math.hypot(dx, dy) || 1;
    if (d < P.magnet) { o.vx += dx / d * .62 * k; o.vy += dy / d * .62 * k; }
    o.x += o.vx * k; o.y += o.vy * k; o.vx *= .94; o.vy *= .94;
    if (d < 20) { o.dead = true; gainXP(); }
  }
  orbs = orbs.filter(o => !o.dead);
  for (const c of corpses) {
    c.life -= dt / 1000;
    c.x += c.vx * k; c.y += c.vy * k;
    c.vx *= .90; c.vy *= .90;
    if (c.mode === "tumble") { c.rot += c.rotV * k; c.vy += .14 * k; }
    if (c.mode === "fall") c.rot += (1.5 - c.rot) * .09 * k;
    if (c.mode === "blast") c.rot += .06 * k;
  }
  corpses = corpses.filter(c => c.life > 0);

  for (const p of puffs) { p.x += p.vx * k; p.y += p.vy * k; p.vx *= .92; p.vy *= .92; p.life -= dt / 430; }
  puffs = puffs.filter(p => p.life > 0);
  for (const p of pops) { p.y -= .55 * k; p.life -= dt / 750; }
  pops = pops.filter(p => p.life > 0);
  for (const b of booms) { b.r += (b.max - b.r) * .22 * k; b.life -= dt / 380; }
  booms = booms.filter(b => b.life > 0);
}
function gainXP() {
  P.xp += xpBoost > 0 ? 2 : 1;
  // за один кадр можно собрать несколько шариков и перескочить два уровня —
  // копим их в очередь, окно выбора покажем по одному
  while (P.xp >= P.xpNext) {
    P.xp -= P.xpNext;
    P.lvl++;
    P.xpNext = Math.round(P.xpNext * 1.32 + 2);
    queuedLevels++;
  }
  if (P.xp < 0) P.xp = 0;                       // страховка от отрицательной полоски
  if (queuedLevels > 0 && !paused) { SFX.level(); offerCards(); }
}

/* ── карточки ─────────────────────────────────────────────── */
function card(box, icon, title, sub, cb, rare) {
  const el = document.createElement("div");
  el.className = rare ? "card rare" : "card";
  el.innerHTML = `<canvas width="40" height="52"></canvas><div><b>${title}</b><span>${sub}</span></div>`;
  icon(el.querySelector("canvas").getContext("2d"));
  el.onclick = cb; box.appendChild(el);
}
const heroIcon = gear => g => drawHero(g, 18, 50, 1, 0, gear, .62, -.2, 0);
const petIcon = (type, lvl) => g => drawPet(g, 15, 42, type, lvl, 1, 0, { saw: .6, aim: -.3, state: "up", bite: 0 });
function rollPet() {
  const all = Object.keys(PETS).filter(x => x !== lastPetRoll);
  const ty = all[Math.random() * all.length | 0];
  lastPetRoll = ty;
  return ty;
}

function offerCards() {
  paused = true;
  const pool = GK.filter(k => P.gear[k] < GEAR[k].max);
  const pick = [];
  while (pick.length < Math.min(3, pool.length)) {
    const c = pool[Math.random() * pool.length | 0];
    if (!pick.includes(c)) pick.push(c);
  }
  // редкий ствол: небольшой шанс подменить одну из трёх вещей
  const notOwned = RARE_KEYS.filter(w => w !== P.wtype);
  if (notOwned.length && Math.random() < RARE_CHANCE) {
    pendingRare = notOwned[Math.random() * notOwned.length | 0];
    pick[Math.random() * pick.length | 0] = "@rare";
  }

  // четвёртая строка всегда отдана питомцу
  const petRow = !P.pet || P.pet.lvl < PET_MAX;
  if (!P.pet) pendingPet = rollPet();
  if (petRow) pick.push("@pet");
  else {                                          // питомец на максимуме — добираем вещью
    const rest = pool.filter(c => !pick.includes(c));
    if (rest.length) pick.push(rest[Math.random() * rest.length | 0]);
  }

  const close = () => {
    queuedLevels = Math.max(0, queuedLevels - 1);
    document.getElementById("levelup").classList.add("hidden");
    if (queuedLevels > 0) setTimeout(() => { SFX.level(); offerCards(); }, 120);
    else paused = false;
  };
  const box = document.getElementById("cards"); box.innerHTML = "";
  for (const key of pick) {
    if (key === "@rare") {
      const w = pendingRare, W2 = WEAPONS[w];
      card(box, heroIcon({ ...P.gear, _w: w }),
        `${W2.name} <span class="rr">РЕДКОЕ</span>`, W2.desc, () => {
          P.wtype = w; applyGear();
          SFX.chest(); setTimeout(() => SFX.level(), 160);
          close();
        }, true);
      continue;
    }
    if (key === "@pet") {
      const ty = P.pet ? P.pet.type : pendingPet;
      const lv = P.pet ? P.pet.lvl + 1 : 1;
      card(box, petIcon(ty, lv), `${PETS[ty].name} ${"★".repeat(lv)}`,
        P.pet ? "Питомец становится сильнее" : PETS[ty].desc, () => {
          if (P.pet) { P.pet.lvl++; P.pet.hpMax = 4 + P.pet.lvl; P.pet.hp = P.pet.hpMax; }
          else P.pet = makePet(ty);
          close();
        });
      continue;
    }
    const g = { ...P.gear, _w: P.wtype }; g[key]++;
    const nm = key === "gun" ? WEAPONS[P.wtype].name : GEAR[key].name;
    card(box, heroIcon(g), `${nm} ${"★".repeat(g[key])}`, GEAR[key].desc, () => {
      P.gear[key]++; applyGear(); P.hp = Math.min(P.hpMax, P.hp + 1); close();
    });
  }
  document.getElementById("queueTag").textContent =
    queuedLevels > 1 ? `ещё уровней в очереди: ${queuedLevels - 1}` : "";
  document.getElementById("levelup").classList.remove("hidden");
}

function offerPerks() {
  const keys = Object.keys(PERKS), pick = [];
  while (pick.length < 3) { const c = keys[Math.random() * keys.length | 0]; if (!pick.includes(c)) pick.push(c); }
  const box = document.getElementById("perks"); box.innerHTML = "";
  for (const key of pick)
    card(box, heroIcon(P.gear), `${PERKS[key].name} ${"◆".repeat(meta[key] + 1)}`, PERKS[key].desc, () => {
      meta[key]++; document.getElementById("over").classList.add("hidden"); start();
    });
}


/* ── пять моделей оружия ──────────────────────────────────── */
function drawGunModel(g, lv, muzzle, type) {
  if (type && type !== "basic") return drawRareGun(g, lv, muzzle, type);
  return drawBasicGun(g, lv, muzzle);
}

function drawRareGun(g, lv, muzzle, type) {
  g.strokeStyle = INK; g.lineWidth = 2.2; g.lineCap = "round"; g.lineJoin = "round";
  let tip = 26;
  if (type === "shotgun") {
    const L = 24 + lv * 2.5;
    spoly(g, [[2, -6], [L, -6], [L, -2.6], [2, -2.6]], "#6f7a82");     // верхний ствол
    spoly(g, [[2, -2.4], [L, -2.4], [L, 1], [2, 1]], "#6f7a82");       // нижний
    spoly(g, [[-1, -2], [11, -2], [9, 12], [-4, 9]], "#7a5330");       // приклад
    spoly(g, [[12, 1], [21, 1], [21, 4.6], [12, 4.6]], "#8a6238");     // цевьё
    g.lineWidth = 1.4; sline(g, 14, 2.8, 19, 2.8); g.lineWidth = 2.2;
    tip = L;
  } else if (type === "sniper") {
    const L = 40 + lv * 3.5;
    spoly(g, [[2, -4], [L, -3], [L, -.6], [2, .6]], "#5b636a");
    spoly(g, [[-2, -2], [12, -2], [10, 13], [-5, 10]], "#3f3a34");     // приклад
    spoly(g, [[10, -12], [26, -12], [26, -5.4], [10, -5.4]], "#2f2c28");// прицел
    scircle(g, 26, -8.7, 3.4, "#9fd6e8");
    g.lineWidth = 1.4; sline(g, 12, -8.7, 22, -8.7); g.lineWidth = 2.2;
    spoly(g, [[L - 12, 1], [L - 9, 1], [L - 4, 11], [L - 7, 11]], "#4a4a52");  // сошки
    spoly(g, [[L - 12, 1], [L - 9, 1], [L - 16, 11], [L - 19, 11]], "#4a4a52");
    tip = L;
  } else {
    const L = 26 + lv * 2;
    spoly(g, [[-2, -3], [10, -3], [9, 12], [-5, 9]], "#3f3a34");       // корпус
    spoly(g, [[8, 2], [19, 2], [19, 12], [8, 12]], "#5d666d");         // короб
    g.save(); g.translate(12, -3); g.rotate((P.spin || 0));            // блок стволов
    for (let i = 0; i < 3; i++) {
      const a = i * 2.09, oy = Math.sin(a) * 3.4;
      spoly(g, [[0, oy - 1.6], [L, oy - 1.6], [L, oy + 1.6], [0, oy + 1.6]], i ? "#7b848b" : "#98a1a8");
    }
    g.restore();
    scircle(g, 12, -3, 5.2, "#5d666d");
    tip = L + 12;
  }
  if (muzzle > 0) {
    g.strokeStyle = "#e08a2a"; g.lineWidth = 2.6;

    for (let i = 0; i < n; i++)
      sline(g, tip, -2, tip + 11 + lv * 2, -2 + (i - (n - 1) / 2) * (5 + lv));
    g.strokeStyle = INK; g.lineWidth = 2.2;
  }
}

function drawBasicGun(g, lv, muzzle) {

/* ── человечек: линии + одежда + ружьё ────────────────────── */
/* Пропорции героя (локальные единицы, ступни на y = 0):
   бедро -18 · плечи -40 · шея -44 · голова -52, r 8.5
   Толщина линий задаёт иерархию: скелет 3.0, одежда 2.2, мелочи 1.4 —
   иначе всё сливается в кашу.                                        */
function drawHero(g, x, y, face, phase, gear, sc, aim, muzzle) {
  const sw = Math.sin(phase) * .6;
  g.save(); g.translate(x, y); g.scale(sc, sc);
  g.lineCap = "round"; g.lineJoin = "round";
  const C = l => TIER[Math.min(4, l)];
  const SK = 3.0, CL = 2.2, DT = 1.4;

  // тень под ногами — привязывает фигуру к земле
  g.globalAlpha = .13; g.fillStyle = INK;
  g.beginPath(); g.ellipse(0, 1, 13, 3.6, 0, 0, 7); g.fill();
  g.globalAlpha = 1;

  /* ── ПЛАЩ ── */
  if (gear.cape) {
    const L = gear.cape;
    g.save(); g.scale(face, 1); g.strokeStyle = INK; g.lineWidth = CL;
    if (L === 1) spoly(g, [[-3, -42], [-17, -12], [4, -15]], C(L));
    else if (L === 2) {
      spoly(g, [[-3, -43], [-22, -3], [5, -12]], C(L));
      g.lineWidth = DT; sline(g, -9, -30, -14, -10);
    } else {
      spoly(g, [[-3, -44], [-26, 3], [-18, -2], [-22, 4], [-12, -4], [-15, 3], [5, -12]], C(L));
      g.lineWidth = DT; sline(g, -9, -32, -16, -8); sline(g, -15, -26, -21, -4);
    }
    g.restore();
  }

  /* ── НОГИ ── */
  g.strokeStyle = INK; g.lineWidth = SK;
  sline(g, 0, -18, sw * 11, -2); sline(g, 0, -18, -sw * 11, -2);

  /* ── ОБУВЬ ── */
  if (gear.boots) {
    const L = gear.boots;
    g.save(); g.scale(face, 1); g.lineWidth = CL;
    for (const d of [1, -1]) {
      g.save(); g.translate(d * sw * 11, -2);
      if (L === 1) spoly(g, [[-4, -5], [4, -5], [5.5, 1], [-4, 1]], C(L));
      else if (L === 2) {
        spoly(g, [[-4, -12], [4, -12], [5.5, 1], [-4, 1]], C(L));
        g.lineWidth = DT; sline(g, -4, -8, 4, -8); g.lineWidth = CL;
      } else if (L === 3) {
        spoly(g, [[-4.5, -15], [5, -15], [6, 1], [-4.5, 1]], C(L));
        g.lineWidth = DT; sline(g, -4.5, -11, 5, -11); sline(g, -4.5, -6, 5.5, -6); g.lineWidth = CL;
      } else {
        spoly(g, [[-5, -18], [5.5, -18], [6.5, 1], [-5, 1]], C(L));
        g.lineWidth = DT; sline(g, -5, -13, 5.5, -13); sline(g, -5, -7, 6, -7); g.lineWidth = CL;
        spoly(g, [[6.5, -3], [11, -1], [6.5, 1]], C(L));
      }
      g.restore();
    }
    g.restore();
  }

  /* ── ТОРС ── */
  g.strokeStyle = INK; g.lineWidth = SK;
  sline(g, 0, -18, 0, -40);

  /* ── КУРТКА ── */
  if (gear.jacket) {
    const L = gear.jacket;
    g.save(); g.scale(face, 1); g.lineWidth = CL;
    if (L === 1) {
      spoly(g, [[-8, -39], [8, -39], [7, -19], [-7, -19]], C(L));
      spoly(g, [[-4, -39], [0, -31], [4, -39]], PAPER);
    } else if (L === 2) {
      spoly(g, [[-9, -39], [9, -39], [7.5, -18], [-7.5, -18]], C(L));
      spoly(g, [[-9, -39], [-2.5, -39], [-5, -31]], "#efe6d2");
      spoly(g, [[9, -39], [2.5, -39], [5, -31]], "#efe6d2");
      g.fillStyle = "#efe6d2";
      for (let i = 0; i < 2; i++) { g.beginPath(); g.arc(0, -30 + i * 6, 1.5, 0, 7); g.fill(); }
    } else {
      spoly(g, [[-9.5, -39], [9.5, -39], [8, -18], [-8, -18]], C(L));
      g.lineWidth = DT; sline(g, -8, -30, 8, -30); sline(g, 0, -39, 0, -18); g.lineWidth = CL;
      scircle(g, -11, -37, 5.4, C(L)); scircle(g, 11, -37, 5.4, C(L));
    }
    g.restore();
  }

  /* ── ПОЯС ── */
  if (gear.clip) {
    const L = gear.clip;
    g.save(); g.scale(face, 1);
    g.strokeStyle = "#6b4a2a"; g.lineWidth = 3; sline(g, -8, -19, 8, -19);
    g.strokeStyle = INK; g.lineWidth = CL;
    for (let i = 0; i < L; i++)
      spoly(g, [[-8 + i * 6, -18.5], [-3.4 + i * 6, -18.5], [-3.4 + i * 6, -11.5], [-8 + i * 6, -11.5]], C(L));
    g.restore();
  }

  /* ── ЗАДНЯЯ РУКА ── */
  g.save(); g.scale(face, 1);
  g.strokeStyle = INK; g.lineWidth = SK;
  sline(g, 0, -38, -10, -26 + sw * 4);
  if (gear.gloves) {
    g.lineWidth = gear.gloves >= 3 ? 7 : 5.6; g.strokeStyle = C(gear.gloves);
    sline(g, -8, -28 + sw * 4, -10.5, -25.5 + sw * 4);
  }
  g.restore();

  /* ── РУЖЬЁ ── */
  g.save(); g.translate(2, -27); g.rotate(face > 0 ? aim : Math.PI - aim);
  g.scale(face * 1.3, 1.3);
  drawGunModel(g, gear.gun || 0, muzzle, gear._w);
  g.restore();

  /* ── ПЕРЕДНЯЯ РУКА ── */
  g.save(); g.scale(face, 1);
  g.strokeStyle = INK; g.lineWidth = SK;
  sline(g, 0, -38, 11, -27);
  if (gear.gloves) {
    const L = gear.gloves;
    g.lineWidth = L >= 3 ? 7 : 5.6; g.strokeStyle = C(L);
    sline(g, 8.5, -29, 12, -26.5);
    if (L >= 3) {
      g.lineWidth = DT; g.strokeStyle = INK;
      sline(g, 7, -31.5, 9.5, -34); sline(g, 9.5, -34, 12, -31.5);
    }
    if (L >= 4) { g.fillStyle = "#efe6d2"; g.beginPath(); g.arc(11, -29, 1.5, 0, 7); g.fill(); }
  }
  g.restore();

  /* ── ШЕЯ и ГОЛОВА ── */
  g.strokeStyle = INK; g.lineWidth = SK;
  sline(g, 0, -40, 0, -44);
  g.fillStyle = PAPER; scircle(g, 0, -52, 8.5, PAPER);
  g.fillStyle = INK;
  g.beginPath(); g.arc(face * 3, -53.5, 1.25, 0, 7); g.fill();

  const fullHelm = gear.helm >= 3;

  /* ── ОЧКИ ── */
  if (gear.scope && !fullHelm) {
    const L = gear.scope;
    g.save(); g.scale(face, 1); g.strokeStyle = INK;
    if (L === 1) {
      g.lineWidth = DT + .3;
      scircle(g, -3.6, -53.5, 3.2, "#dfeaf0"); scircle(g, 4.2, -53.5, 3.2, "#dfeaf0");
      sline(g, -.4, -54, 1, -54); sline(g, 7.4, -54.4, 10, -55.6);
    } else {
      g.lineWidth = CL;
      spoly(g, [[-9, -56.5], [9, -55.5], [8.4, -50], [-8.4, -51]], C(L));
      g.lineWidth = DT; g.strokeStyle = "#efe6d2"; sline(g, -6, -54.6, 2, -53.6); g.strokeStyle = INK;
      if (L >= 3) { sline(g, -9, -54, -13, -53.4); sline(g, 9, -53, 13, -52.4); }
    }
    g.restore();
  }

  /* ── ГОЛОВНОЙ УБОР ── */
  if (gear.helm) {
    const L = gear.helm;
    g.save(); g.scale(face, 1); g.strokeStyle = INK; g.lineWidth = CL;
    if (L === 1) {
      g.beginPath(); g.arc(0, -56, 8.7, Math.PI, 0); g.fillStyle = C(L); g.fill(); g.stroke();
      spoly(g, [[1, -57], [15, -55], [1, -53]], C(L));
    } else if (L === 2) {
      g.beginPath(); g.arc(0, -56, 9.4, Math.PI, 0); g.fillStyle = C(L); g.fill(); g.stroke();
      spoly(g, [[-11.5, -56], [11.5, -56], [10.6, -52.4], [-10.6, -52.4]], C(L));
    } else {
      g.beginPath(); g.arc(0, -55.5, 9.8, Math.PI, .18); g.fillStyle = C(L); g.fill(); g.stroke();
      spoly(g, [[-12, -55.5], [12, -55.5], [11, -51.6], [-11, -51.6]], C(L));
      spoly(g, [[2, -55], [6, -55], [5.4, -44], [2.6, -44]], C(L));      // наносник
      if (L >= 4) {
        g.fillStyle = "#c8402c";                                          // плюмаж
        g.beginPath(); g.moveTo(-1, -65);
        g.bezierCurveTo(-13, -70, -17, -56, -11, -51);
        g.bezierCurveTo(-11, -60, -6, -63, -1, -65);
        g.closePath(); g.fill(); g.stroke();
        g.fillStyle = "#efe6d2"; scircle(g, 0, -64, 2.6, "#efe6d2");
      }
    }
    g.restore();
  }
  g.restore();
}

function drawFoe(g, x, y, face, phase, sc, col, kind, rot) {
  const sw = Math.sin(phase) * .6;
  g.save(); g.translate(x, y);
  if (rot) g.rotate(rot);
  g.scale(sc, sc);
  g.strokeStyle = col; g.lineWidth = 2.4; g.lineCap = "round"; g.lineJoin = "round";

  if (kind === "runner") {
    // бегун: наклон вперёд, руки назад, частый шаг
    g.save(); g.scale(face, 1); g.rotate(-.20);
    const f = Math.sin(phase * 1.55) * .85;
    sline(g, 0, -11, f * 11, 2); sline(g, 0, -11, -f * 11, 2);
    sline(g, 0, -11, 0, -24);
    sline(g, 0, -21, -10, -14 + f * 4);
    sline(g, 0, -21, -8, -25 - f * 3);
    g.fillStyle = PAPER; scircle(g, 2, -29, 5.2, PAPER);
    g.fillStyle = col; g.beginPath(); g.arc(4, -30, .9, 0, 7); g.fill();
    g.restore();

  } else if (kind === "tank") {
    // танк: тяжёлый шаг, приседает на опорной ноге, широкие плечи
    const squash = Math.abs(Math.sin(phase)) * 2.2;
    g.translate(0, squash);
    g.lineWidth = 3.4;
    g.save(); g.scale(face, 1);
    sline(g, 0, -10, sw * 7, 2); sline(g, 0, -10, -sw * 7, 2);
    sline(g, 0, -10, 0, -24);
    sline(g, -9, -22, 9, -22);                       // плечи
    sline(g, 9, -22, 12, -13 + sw * 4);
    sline(g, -9, -22, -12, -13 - sw * 4);
    g.fillStyle = PAPER; scircle(g, 0, -30, 6.4, PAPER);
    g.fillStyle = col; g.beginPath(); g.arc(2, -31, 1, 0, 7); g.fill();
    g.lineWidth = 2.4;
    sline(g, -5, -35, 5, -35);                       // насупленная бровь
    g.restore();

  } else if (kind === "elite") {
    // элита: покачивается, руки подняты, рожки
    const sway = Math.sin(phase * .7) * .10;
    g.rotate(sway);
    g.lineWidth = 3;
    g.save(); g.scale(face, 1);
    sline(g, 0, -12, sw * 9, 2); sline(g, 0, -12, -sw * 9, 2);
    sline(g, 0, -12, 0, -26);
    const arm = Math.sin(phase * 1.3) * 4;
    sline(g, 0, -24, 11, -32 + arm); sline(g, 0, -24, -11, -32 - arm);
    g.fillStyle = PAPER; scircle(g, 0, -33, 6.6, PAPER);
    g.fillStyle = col;
    g.beginPath(); g.arc(2.4, -34, 1.1, 0, 7); g.fill();
    g.beginPath(); g.arc(-2.4, -34, 1.1, 0, 7); g.fill();
    spoly(g, [[-6, -38], [-4, -45], [-2, -38]], col);   // рожки
    spoly(g, [[6, -38], [4, -45], [2, -38]], col);
    g.restore();

  } else {
    // обычный: бег с покачиванием корпуса
    const bob = Math.sin(phase * 2) * 1.3;
    g.translate(0, bob);
    g.save(); g.scale(face, 1);
    sline(g, 0, -11, sw * 8, 2); sline(g, 0, -11, -sw * 8, 2);
    sline(g, 0, -11, 0, -25);
    sline(g, 0, -22, 8, -17 + sw * 3); sline(g, 0, -22, -8, -17 - sw * 3);
    g.fillStyle = PAPER; scircle(g, 0, -30, 5.6, PAPER);
    g.fillStyle = col; g.beginPath(); g.arc(1.8, -31, .9, 0, 7); g.fill();
    g.restore();
  }
  g.restore();
}

function drawCorpse(g, c) {
  const a = Math.max(0, Math.min(1, c.life / c.max));
  g.globalAlpha = a;
  if (c.mode === "pop") {                      // лопается облачком
    const k = 1 - a;
    g.strokeStyle = FOE; g.lineWidth = 2.6;
    scircle(g, c.x, c.y - 12 * c.sc, (6 + k * 18) * c.sc, null);
    for (let i = 0; i < 5; i++) {
      const an = i * 1.256 + c.phase;
      sline(g, c.x + Math.cos(an) * 10 * c.sc, c.y - 12 * c.sc + Math.sin(an) * 10 * c.sc,
               c.x + Math.cos(an) * (16 + k * 14) * c.sc, c.y - 12 * c.sc + Math.sin(an) * (16 + k * 14) * c.sc);
    }
  } else {
    drawFoe(g, c.x, c.y, c.face, c.phase, c.sc, FOE, c.kind, c.rot * c.face);
    if (c.mode === "blast") {                  // элиту рвёт на части
      const k = 1 - a;
      g.strokeStyle = FOE; g.lineWidth = 2.4;
      for (let i = 0; i < 7; i++) {
        const an = i * .9 + c.phase, r0 = 12 + k * 46;
        sline(g, c.x + Math.cos(an) * r0, c.y - 20 + Math.sin(an) * r0,
                 c.x + Math.cos(an) * (r0 + 11), c.y - 20 + Math.sin(an) * (r0 + 11));
      }
    }
  }
  g.globalAlpha = 1;
}

/* ── кадр ─────────────────────────────────────────────────── */
function draw() {
  ctx.fillStyle = PAPER; ctx.fillRect(0, 0, W, H);
  ctx.save();
  if (shake > .2) ctx.translate((Math.random() - .5) * shake, (Math.random() - .5) * shake);
  ctx.translate(-cam.x, -cam.y);
  const L = cam.x - 70, R = cam.x + W + 70, T = cam.y - 70, B = cam.y + H + 70;
  const vis = o => o.x > L && o.x < R && o.y > T && o.y < B;

  // тетрадная сетка
  ctx.strokeStyle = "rgba(120,100,70,.11)"; ctx.lineWidth = 1;
  for (let x = Math.floor(L / 58) * 58; x < R; x += 58) { ctx.beginPath(); ctx.moveTo(x, T); ctx.lineTo(x, B); ctx.stroke(); }
  for (let y = Math.floor(T / 58) * 58; y < B; y += 58) { ctx.beginPath(); ctx.moveTo(L, y); ctx.lineTo(R, y); ctx.stroke(); }
  ctx.strokeStyle = INK; ctx.lineWidth = 4; ctx.strokeRect(0, 0, WORLD, WORLD);

  ctx.lineCap = "round"; ctx.lineJoin = "round";

  for (const ic of ices) {                       // каток
    const a = Math.min(1, ic.life / 1500);
    ctx.globalAlpha = .35 * a; ctx.fillStyle = "#a9dcf0";
    ctx.beginPath(); ctx.arc(ic.x, ic.y, ic.r, 0, 7); ctx.fill();
    ctx.globalAlpha = .75 * a; ctx.strokeStyle = "#4aa8cf"; ctx.lineWidth = 2.5;
    ctx.stroke();
    for (let i = 0; i < 6; i++) {
      const an = i * 1.05 + ic.x;
      sline(ctx, ic.x + Math.cos(an) * ic.r * .3, ic.y + Math.sin(an) * ic.r * .3,
                 ic.x + Math.cos(an) * ic.r * .8, ic.y + Math.sin(an) * ic.r * .8);
    }
    ctx.globalAlpha = 1;
  }

  for (const o of props) {                       // камни, кусты, деревья
    if (!vis(o)) continue;
    ctx.save(); ctx.translate(o.x, o.y);
    ctx.strokeStyle = INK; ctx.lineWidth = 2.6;
    if (o.kind === "rock") {
      spoly(ctx, o.pts, "#ded2be");
      ctx.lineWidth = 1.6;
      sline(ctx, -o.r * .3, -o.r * .1, o.r * .1, o.r * .35);
      sline(ctx, o.r * .05, -o.r * .35, o.r * .35, 0);
    } else if (o.kind === "bush") {
      spoly(ctx, o.pts, "#bcd3a8");
      ctx.lineWidth = 1.5;
      for (let i = 0; i < 4; i++) {
        const a = i * 1.5 + o.seed * 6;
        sline(ctx, Math.cos(a) * o.r * .2, Math.sin(a) * o.r * .2,
                   Math.cos(a) * o.r * .55, Math.sin(a) * o.r * .55);
      }
    } else {
      ctx.lineWidth = 3; ctx.strokeStyle = "#7a5a35";
      sline(ctx, 0, o.r * .7, 0, -o.r * .2);
      ctx.strokeStyle = INK; ctx.lineWidth = 2.6;
      scircle(ctx, 0, -o.r * .55, o.r * .8, "#9dc48a");
      scircle(ctx, -o.r * .45, -o.r * .15, o.r * .5, "#b0d39c");
    }
    ctx.restore();
  }

  for (const h of pickups) {                     // бусты на карте
    if (!vis(h)) continue;
    drawPickup(ctx, h);
  }
  for (const c of chests) {                      // сундук
    if (!vis(c)) continue;
    ctx.strokeStyle = INK; ctx.lineWidth = 2.6;
    ctx.save(); ctx.translate(c.x, c.y);
    spoly(ctx, [[-19, -2], [19, -2], [17, 13], [-17, 13]], "#c98f4e");   // короб
    ctx.beginPath(); ctx.moveTo(-19, -2);                                 // крышка дугой
    ctx.quadraticCurveTo(0, -22, 19, -2); ctx.closePath();
    ctx.fillStyle = "#dda964"; ctx.fill(); ctx.stroke();
    ctx.lineWidth = 2.2;
    sline(ctx, -19, -2, 19, -2);
    sline(ctx, -8, -16, -8, 13); sline(ctx, 8, -16, 8, 13);               // окантовка
    spoly(ctx, [[-4, -4], [4, -4], [4, 5], [-4, 5]], "#e8c66a");          // замок
    ctx.fillStyle = INK;
    ctx.beginPath(); ctx.arc(0, 0, 1.5, 0, 7); ctx.fill();
    ctx.strokeStyle = "#e8c66a"; ctx.lineWidth = 1.8;                     // искры
    for (let i = 0; i < 3; i++) {
      const a2 = c.a + i * 2.1, rr = 26 + Math.sin(c.a * 2 + i) * 4;
      sline(ctx, Math.cos(a2) * rr, -6 + Math.sin(a2) * rr * .5,
                 Math.cos(a2) * (rr + 5), -6 + Math.sin(a2) * (rr + 5) * .5);
    }
    ctx.strokeStyle = INK; ctx.lineWidth = 2.6;
    ctx.restore();
    const oy = c.y - 36 + Math.sin(c.a * 2) * 5;
    drawItemIcon(ctx, c.item, c.x, oy, 1.05);
  }

  ctx.strokeStyle = INK; ctx.lineWidth = 2;
  for (const o of orbs) { if (!vis(o)) continue; scircle(ctx, o.x, o.y, 4.5, "#dfa128"); }
  for (const m of mines) {
    ctx.globalAlpha = m.arm > 0 ? .5 : 1;
    if (m.mini) { ctx.lineWidth = 2; scircle(ctx, m.x, m.y, 6, "#4e8f4a");
      ctx.fillStyle = "#ffe0b0"; ctx.beginPath(); ctx.arc(m.x, m.y, 2, 0, 7); ctx.fill(); }
    else drawItemIcon(ctx, "mine", m.x, m.y, .95);
    ctx.globalAlpha = 1;
    if (m.arm <= 0 && !m.mini) { ctx.fillStyle = "#ffe0b0";
      ctx.beginPath(); ctx.arc(m.x, m.y, 1.6 + Math.sin(t / 120) * 1.4, 0, 7); ctx.fill(); }
  }
  for (const g of nades) { ctx.save(); ctx.translate(g.x, g.y); ctx.rotate(t / 90); drawItemIcon(ctx, "nade", 0, 0, .85); ctx.restore(); }
  for (const p of puffs) {
    ctx.globalAlpha = Math.max(0, p.life); ctx.lineWidth = 1.8;
    scircle(ctx, p.x, p.y, p.r, "#e0d3bd"); ctx.globalAlpha = 1;
  }
  for (const c of corpses) drawCorpse(ctx, c);
  for (const e of enemies) {
    if (!vis(e)) continue;
    drawFoe(ctx, e.x, e.y + 13 * (e.r / 11), e.face, e.phase, e.r / 11, e.flash > 0 ? "#f0907c" : FOE, e.kind, 0);
    if (e.kind === "elite" || e.kind === "tank") {
      const w = e.r * 2.2;
      ctx.fillStyle = "rgba(0,0,0,.12)"; ctx.fillRect(e.x - w / 2, e.y - e.r - 18, w, 4);
      ctx.fillStyle = FOE; ctx.fillRect(e.x - w / 2, e.y - e.r - 18, w * Math.max(0, e.hp / e.maxhp), 4);
    }
  }
  for (const b of booms) {
    ctx.globalAlpha = Math.max(0, b.life); ctx.strokeStyle = "#e08a2a"; ctx.lineWidth = 5;
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, 7); ctx.stroke(); ctx.globalAlpha = 1;
  }
  for (const s of shots) {
    if (s.kind === "sniper") {
      ctx.strokeStyle = "#8a53c4"; ctx.lineWidth = 3.4;
      ctx.beginPath(); ctx.moveTo(s.x, s.y);
      ctx.lineTo(s.x - Math.cos(s.a) * 34, s.y - Math.sin(s.a) * 34); ctx.stroke();
      ctx.globalAlpha = .3; ctx.lineWidth = 7;
      ctx.beginPath(); ctx.moveTo(s.x, s.y);
      ctx.lineTo(s.x - Math.cos(s.a) * 26, s.y - Math.sin(s.a) * 26); ctx.stroke();
      ctx.globalAlpha = 1;
    } else if (s.kind === "pellet") {
      ctx.fillStyle = "#7a5330";
      ctx.beginPath(); ctx.arc(s.x, s.y, 2.4, 0, 7); ctx.fill();
    } else if (s.kind === "mini") {
      ctx.strokeStyle = "#e08a2a"; ctx.lineWidth = 2.6;
      ctx.beginPath(); ctx.moveTo(s.x, s.y);
      ctx.lineTo(s.x - Math.cos(s.a) * 8, s.y - Math.sin(s.a) * 8); ctx.stroke();
    } else {
      ctx.strokeStyle = INK; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(s.x, s.y);
      ctx.lineTo(s.x - Math.cos(s.a) * 11, s.y - Math.sin(s.a) * 11); ctx.stroke();
    }
  }
  for (const eg of eggs) drawEgg(ctx, eg);
  for (const ch of chicks) drawChick(ctx, ch);
  for (const tu of turrets) drawTurret(ctx, tu);
  if (running) {
    if (P.pet && P.pet.dead <= 0 && !(P.pet.hurt > 0 && Math.floor(t / 80) % 2 === 0)) {
      drawPet(ctx, P.pet.x, P.pet.y, P.pet.type, P.pet.lvl, P.pet.face, P.pet.phase, P.pet);
      const w = 22;
      ctx.fillStyle = "rgba(43,38,32,.18)"; ctx.fillRect(P.pet.x - w / 2, P.pet.y - 40, w, 3.5);
      ctx.fillStyle = "#4e8f4a"; ctx.fillRect(P.pet.x - w / 2, P.pet.y - 40, w * (P.pet.hp / P.pet.hpMax), 3.5);
    }
    if (P.invT > 0) {
      ctx.globalAlpha = .45;
      ctx.strokeStyle = "#4aa8cf"; ctx.lineWidth = 2.4; ctx.setLineDash([6, 6]);
      ctx.beginPath(); ctx.arc(P.x, P.y - 8, 34, 0, 7); ctx.stroke();
      ctx.setLineDash([]);
    }
    if (!(P.hurt > 0 && Math.floor(t / 85) % 2 === 0))
      drawHero(ctx, P.x, P.y + 17, P.face, P.phase, { ...P.gear, _w: P.wtype }, 1.02, P.aim, P.muzzle);
    ctx.globalAlpha = 1;
  }
  ctx.font = "700 14px system-ui"; ctx.textAlign = "center";
  for (const p of pops) {
    ctx.globalAlpha = Math.min(1, p.life * 1.6); ctx.fillStyle = p.col;
    ctx.fillText(p.txt, p.x, p.y); ctx.globalAlpha = 1;
  }
  ctx.textAlign = "left"; ctx.restore();
  hud();
}

/* ── интерфейс ────────────────────────────────────────────── */
function hud() {
  ctx.fillStyle = "rgba(245,236,221,.9)"; ctx.fillRect(0, 0, W, 46);
  ctx.strokeStyle = INK; ctx.lineWidth = 2; sline(ctx, 0, 46, W, 46);
  ctx.lineWidth = 2;
  for (let i = 0; i < P.hpMax; i++) {
    ctx.strokeStyle = INK; scircle(ctx, 16 + i * 15, 17, 5, i < P.hp ? FOE : PAPER);
  }
  const bw = W - 32;
  ctx.strokeStyle = INK; ctx.lineWidth = 1.6;
  ctx.strokeRect(16, 30, bw, 6);
  ctx.fillStyle = HERO; ctx.fillRect(16, 30, bw * (P.xp / P.xpNext), 6);
  ctx.fillStyle = INK; ctx.font = "700 13px system-ui"; ctx.textAlign = "right";
  ctx.fillText(`LV ${P.lvl}   ${score}   ${(t / 1000).toFixed(0)}s`, W - 16, 20);
  ctx.textAlign = "left";
  let by = 58;
  const buff = (act, max, col, label) => {
    if (act <= 0) return;
    ctx.fillStyle = "rgba(43,38,32,.13)"; ctx.fillRect(16, by, 96, 12);
    ctx.fillStyle = col; ctx.fillRect(16, by, 96 * Math.min(1, act / max), 12);
    ctx.strokeStyle = INK; ctx.lineWidth = 1.6; ctx.strokeRect(16, by, 96, 12);
    ctx.fillStyle = INK; ctx.font = "800 9px system-ui";
    ctx.fillText(label, 21, by + 9.2);
    by += 16;
  };
  buff(xpBoost, 20000, "#f0c443", "ОПЫТ ×2");
  buff(P.hasteT, 7000, "#f0a83a", "УСКОРЕНИЕ");
  buff(P.invT, 6000, "#a9dcf0", "НЕУЯЗВИМОСТЬ");
  radar(); syncHUD();
}
function radar() {
  const S = Math.min(112, W * .28), x = W - S - 12, y = 56, s = S / WORLD;
  ctx.fillStyle = "rgba(253,246,232,.92)"; ctx.strokeStyle = INK; ctx.lineWidth = 2.4;
  ctx.beginPath(); ctx.roundRect(x, y, S, S, 6); ctx.fill(); ctx.stroke();
  ctx.save(); ctx.beginPath(); ctx.roundRect(x, y, S, S, 6); ctx.clip();
  ctx.fillStyle = "rgba(120,140,100,.5)";
  for (const o of props) ctx.fillRect(x + o.x * s - 1, y + o.y * s - 1, 2.4, 2.4);
  ctx.fillStyle = FOE;
  for (const e of enemies) ctx.fillRect(x + e.x * s - 1, y + e.y * s - 1, 2, 2);
  ctx.fillStyle = "#4e8f4a";
  for (const tu of turrets) ctx.fillRect(x + tu.x * s - 1, y + tu.y * s - 1, 3, 3);
  if (P.pet && P.pet.dead <= 0) { ctx.fillStyle = "#3d78bd"; ctx.fillRect(x + P.pet.x * s - 1, y + P.pet.y * s - 1, 3, 3); }
  ctx.fillStyle = "#dfa128";
  for (const c of chests) ctx.fillRect(x + c.x * s - 2, y + c.y * s - 2, 5, 5);
  for (const h of pickups) {
    ctx.fillStyle = BOOSTS[h.kind].col;
    ctx.fillRect(x + h.x * s - 2, y + h.y * s - 2, 4.5, 4.5);
  }
  ctx.strokeStyle = "rgba(43,38,32,.4)"; ctx.lineWidth = 1;
  ctx.strokeRect(x + cam.x * s, y + cam.y * s, W * s, H * s);
  ctx.fillStyle = HERO;
  ctx.beginPath(); ctx.arc(x + P.x * s, y + P.y * s, 3.2, 0, 7); ctx.fill();
  ctx.restore();
}
const useBtn = document.getElementById("useBtn");
const useIco = document.getElementById("useIco");
const useName = document.getElementById("useName");
const petBadge = document.getElementById("petBadge");
const petCtx = petBadge.getContext("2d");
const REVIVE = 12000;

function star(g, x, y, r) {
  g.beginPath();
  for (let i = 0; i < 10; i++) {
    const a = -Math.PI / 2 + i * Math.PI / 5, rr = i % 2 ? r * .45 : r;
    g[i ? "lineTo" : "moveTo"](x + Math.cos(a) * rr, y + Math.sin(a) * rr);
  }
  g.closePath();
  g.fillStyle = "#e0a52f"; g.fill();
  g.lineWidth = 1.4; g.strokeStyle = INK; g.stroke();
}

function drawPetBadge() {
  const p = P.pet;
  petBadge.classList.toggle("hidden", !p || !running);
  if (!p || !running) return;
  const S2 = 176, g = petCtx, c = S2 / 2, R = c - 14;
  g.setTransform(2, 0, 0, 2, 0, 0);
  g.clearRect(0, 0, S2, S2);
  const cc = c / 2, RR = R / 2;

  // подложка
  g.beginPath(); g.arc(cc, cc, RR, 0, 7);
  g.fillStyle = "#fdf6e8"; g.fill();
  g.lineWidth = 3; g.strokeStyle = INK; g.stroke();

  // аватарка питомца
  g.save();
  g.beginPath(); g.arc(cc, cc, RR - 2, 0, 7); g.clip();
  g.globalAlpha = p.dead > 0 ? .22 : 1;
  g.translate(cc - 1, cc + 13); g.scale(.92, .92);
  drawPet(g, 0, 0, p.type, p.lvl, 1, p.dead > 0 ? 0 : p.phase * .5,
          { saw: p.saw, aim: -.35, state: "up", bite: 0 });
  g.restore();

  // кольцо воскрешения
  if (p.dead > 0) {
    const done = 1 - p.dead / p.reviveMs;
    g.beginPath(); g.arc(cc, cc, RR + 1, 0, 7);
    g.strokeStyle = "rgba(43,38,32,.14)"; g.lineWidth = 5; g.stroke();
    g.beginPath(); g.arc(cc, cc, RR + 1, -Math.PI / 2, -Math.PI / 2 + done * 6.2832);
    g.strokeStyle = HERO; g.lineWidth = 5; g.lineCap = "round"; g.stroke();
    g.fillStyle = INK; g.font = "800 22px system-ui"; g.textAlign = "center";
    g.fillText(Math.ceil(p.dead / 1000), cc, cc + 8);
  } else {
    // полоска здоровья по нижней дуге
    g.beginPath(); g.arc(cc, cc, RR + 1, .35 * Math.PI, .65 * Math.PI);
    g.strokeStyle = "rgba(43,38,32,.14)"; g.lineWidth = 5; g.stroke();
    g.beginPath();
    g.arc(cc, cc, RR + 1, .65 * Math.PI, .65 * Math.PI - (p.hp / p.hpMax) * .3 * Math.PI, true);
    g.strokeStyle = "#4e8f4a"; g.lineWidth = 5; g.lineCap = "round"; g.stroke();
  }

  // уровень звёздами
  const n = p.lvl, gap = 9.5, y0 = cc + RR - 3;
  for (let i = 0; i < n; i++) star(g, cc + (i - (n - 1) / 2) * gap, y0, 4.4);
}

for (const el of [useBtn, petBadge])
  el.addEventListener("pointerenter", () => { pointer.active = false; });

let lastItem = "x";
function syncHUD() {
  if (P.item !== lastItem) {
    lastItem = P.item;
    useBtn.disabled = !P.item;
    const ig = useIco.getContext("2d");
    ig.setTransform(2, 0, 0, 2, 0, 0); ig.clearRect(0, 0, 36, 36);
    if (P.item) drawItemIcon(ig, P.item, 18, 18, 1.35);
    useName.textContent = P.item ? ITEMS[P.item].name : "пусто";
  }
  pauseBtn.style.display = running ? "flex" : "none";
  devLvl.style.display = running ? "block" : "none";
  drawPetBadge();
}

function start() {
  reset(); running = true;
  document.getElementById("start").classList.add("hidden");
  document.getElementById("over").classList.add("hidden");
}
function gameOver() {
  running = false; meta.best = Math.max(meta.best, Math.round(t / 1000));
  document.getElementById("stats").textContent =
    `${(t / 1000).toFixed(0)} с · лопнул ${score} · уровень ${P.lvl} · рекорд ${meta.best} с`;
  offerPerks(); document.getElementById("over").classList.remove("hidden");
}
document.getElementById("btnStart").onclick = () => { audio(); start(); };
reset(); running = false;
</script>
</body>
</html>
